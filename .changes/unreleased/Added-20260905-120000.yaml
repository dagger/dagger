kind: Added
body: |
  Add Workspace.checkpoint to freeze a workspace's Git history and approved
  working-tree changes. Checkpoints use public GitBundle compositions and can
  be restored without the original checkout when a remote serves their base.
  Local-only repositories still freeze within the session; Workspace.portable
  reports whether the recipe can be restored without its originating client.
  Frozen workspaces retain their config selection and load modules from their
  own tree.
