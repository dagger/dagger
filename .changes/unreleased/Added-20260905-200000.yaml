kind: Added
body: |
  Integrate frozen workspaces with currentWorkspace.withCommitsFrom(source).export.
  Commits fast-forward or cherry-pick onto the destination's history, preserving
  local edits and skipping already integrated work. Pending source edits are an
  explicit changeset composition. Export validates the prepared worktree and
  ref state before writing; stale saves retain the integrated commits on
  refs/dagger/checkpoints/<short-sha> for recovery without rewriting history.
