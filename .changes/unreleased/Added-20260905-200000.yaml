kind: Added
body: |
  Export frozen workspaces with export(path, from). Commits fast-forward or
  cherry-pick onto the destination's history, preserving local edits and
  skipping already integrated work. Pending source edits are included; pass
  from to export only work since a previously saved source value. Export
  captures the destination and validates its worktree and ref state before
  writing.
