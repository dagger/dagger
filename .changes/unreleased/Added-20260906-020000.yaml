kind: Added
body: Ask the owning client before module or agent Git pushes to a remote's default branch (as its HEAD reports it, and always main and master) or to a tag or any other non-branch ref, with separate force-push approval. Pushes to other branches, e.g. a pull request's, force-pushes included, only need the remote approved once, and not even that for the origin of the owner's own workspace checkout. Approvals hold per module, for each destination (and ref), and the owner chooses how long they last - once, for the session, or always for that module (remembered by the client, for modules loaded from Git; never for force-pushes to the default branch or other exact refs); a plain yes/no prompt grants the session. Approved pushes can use the owner's Git credentials or SSH agent without exposing them to the module.
