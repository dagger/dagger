kind: Added
body: Add `dagger workspace ls [PATH...]`, `dagger workspace cat PATH [PATH...]`, and `dagger workspace grep PATTERN [PATH...]` to list paths, read files, and search file contents in the selected local or remote Git workspace. Add `dagger workspace git ref`, `sha`, `dirty`, `log`, and `url` to inspect its Git metadata, commit history, and resolved source URL. These commands also work through the `ws` alias.
