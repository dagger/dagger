kind: Added
body: Add `dagger workspace ls [PATH...]` and `dagger workspace cat PATH [PATH...]` to list paths and read files from the selected local or remote Git workspace. Add `dagger workspace git ref`, `sha`, `dirty`, `log`, and `url` to inspect its Git metadata, commit history, and resolved source URL. These commands also work through the `ws` alias.
