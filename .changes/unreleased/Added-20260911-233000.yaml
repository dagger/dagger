kind: Added
body: Git refs and commits now accept abbreviated commit SHAs (unambiguous hex prefixes, like `git rev-parse`) anywhere a ref or commit identifier is accepted. Ambiguous prefixes error with the number of matching commits. Remote repositories are resolved via ls-remote, so they can only expand prefixes of commits that were already fetched.
