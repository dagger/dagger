kind: Added
body: |-
  Report operation-level network receive and transmit byte metrics for
  container execs, HTTP downloads, native Git fetches, registry image pulls
  and pushes, host filesync, host sockets and tunnels, and LLM requests.
  Container exec metrics additionally separate Dagger-internal traffic from
  external traffic using TCX eBPF on the host-side CNI veth.
  Engine metrics also report exact cgroup network bytes by engine or operation
  owner, internal or external scope, and receive or transmit direction.
