kind: Added
body: |
  Add an optional engine-owned OTLP destination for engine and session telemetry.
  Configure `telemetry.otlp` in `engine.json` to select an endpoint, protocol,
  and signals independently of CLI and Dagger Cloud export. Logs require
  explicit selection. Workload resource readings retain their source
  timestamps and available final readings.
