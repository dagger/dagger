kind: Added
body: |
  `Workspace.withReset` accepts any target `GitRepository.ref` resolves:
  abbreviated commit hashes, ref names and revision suffixes, e.g.
  `abc1234`, `HEAD~1` or `main^2`. The target resolves against the
  workspace's frozen repository, and HEAD moves to the resulting commit.
