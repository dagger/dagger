kind: Added
body: |
  Review agent changes in a diff viewer: press `ctrl+g` in `dagger agent` to
  browse the Changes panel's uncommitted edits and commits in a sidebar, with
  each one's syntax-highlighted patch alongside. The panel's save and reload
  keys work from the viewer too.
