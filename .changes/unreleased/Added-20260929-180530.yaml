kind: Added
body: |
  Add a `noLock` option to `GitRepository.ref`, `GitRepository.branch`,
  `GitRepository.tag`, `GitRepository.head`, `GitRepository.latest`,
  `Container.from`, and the `Address.container`, `Address.directory`,
  `Address.file`, and `Address.gitRef` loaders. When enabled, the lookup
  neither reads from nor writes to the workspace lockfile.
time: 2026-09-29T18:05:30Z
