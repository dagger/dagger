kind: Added
body: Containers that can call back into Dagger, through Dagger-in-Dagger nesting (the default) or `daggerInDaggerNewSession`, now have the engine's own `dagger` CLI available, mounted read-only at `/dev/.dagger/dagger` and appended to `PATH`. This also works in emulated containers of another architecture.
