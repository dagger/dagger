kind: Added
body: |
  The CLI reads `leave_old_engines` from the `[engine]` section of the user config file (`~/.config/dagger/config.toml` or `$DAGGER_CONFIG`). When it is `true`, starting an engine no longer removes engine containers of other versions. `DAGGER_LEAVE_OLD_ENGINE`, when set, still takes precedence.
