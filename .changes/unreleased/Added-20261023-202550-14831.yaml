kind: Added
body: |
  The engine's whole stop now has one budget, set with `shutdown.gracefulStopTimeout` in engine.json or `--graceful-stop-timeout` (default 5m). Draining the API listeners, the server's shutdown and the final telemetry flushes all share its deadline, so the engine can be given a stop deadline inside a supervisor's grace period.
