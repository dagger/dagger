kind: Added
body: |
  Add the `resolveBrokenSymlinks` option to `Directory.directory`.

  Set this option to `true` to repair links that selection would break.
  The result includes the required targets. Working relative links and
  links that already have no target stay unchanged. The default is
  `false`.
