kind: Added
body: |
  SSHFS volumes take a `followSymlinks` option (`followSymlinks=true` in an `sshfs://` address), so the SSH server resolves symlinks itself. Without it, sshfs can't read absolute symlinks or symlinks containing `..`. With it, links appear as the files and directories they point to, and creating a symlink in the volume fails.
