kind: Added
body: |
  Install a Dagger skill in existing workspace skill directories during `dagger init`.

  Detect `.agents/skills`, `.claude/skills`, `.cursor/skills`, `.gemini/skills`,
  `.github/skills`, and `.opencode/skills` at the workspace root. Add guidance
  for checks, generators, and modules. Preserve existing Dagger skills and
  skip symbolic links.
