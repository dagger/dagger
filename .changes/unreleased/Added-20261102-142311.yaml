kind: Added
body: |
  `entire://` remotes no longer need a git credential helper. When none
  provides a token, the client uses `ENTIRE_TOKEN` from its environment, then
  the Entire CLI's login (`entire auth token`, which honors
  `ENTIRE_CONTEXT`).
