kind: Added
body: |
  Select checks and other artifacts by source paths with `--path`, `--commit`,
  and `--uncommitted`. Inspect the same source dependencies through
  `Artifact.provenance` and `Artifacts.provenance`. Selection prepares inputs
  and enumerates collections without running artifact bodies.
