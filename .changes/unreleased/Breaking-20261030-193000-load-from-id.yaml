kind: Breaking
body: |
  A module function literally named `load<X>FromID` is now named
  `load<X>FromId`, like a field or argument of the same name, whatever engine
  version the module declares: functions no longer keep `FromID`'s spelling.
  The core `load<Type>FromID` loaders are unchanged.
