kind: Changed
body: |
  A `[modules.<name>]` entry in `dagger.toml` may now omit `source`, so it can
  override the settings of a module an `[[include]]` installs. The schema no
  longer requires `source`; instead, loading modules checks that every module
  has one, after the include, user-level overrides and the selected env overlay
  apply.

  A source-less module entry that nothing supplies a source for now fails module
  loading, naming the module, where it previously loaded with an empty
  reference. `dagger workspace config` still reads such a config, so the entry
  can be fixed.
time: 2026-08-25T12:00:00.000000000+00:00
