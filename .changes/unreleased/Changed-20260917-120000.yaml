kind: Changed
body: |
  A check derived from a `+generate` function is now named
  `<generator>:is-empty`, for example `go:generate:is-empty`. It used to carry
  the generator's own name, so `dagger check -l` and `dagger generate -l` listed
  two different things under one name. The check still passes exactly when the
  generator changes nothing, and every pattern that selected or skipped it under
  the generator's name still does, so `dagger check go:generate` and
  `skip = ["generate"]` keep working.
time: 2026-09-17T12:00:00Z
