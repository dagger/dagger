kind: Changed
body: |
  `dagger up` is now `dagger start`, and the service marker is now `start`:
  `// +start` in Go, `@start` in Python and Dang, `@start()` in TypeScript, and
  `@Start` in Java. The former names still work. Service artifacts now report
  the `start` directive instead of `up`.
