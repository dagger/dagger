kind: Changed
body: A nested (Dagger-in-Dagger) exec no longer holds its command until the container's session helper has connected to the engine. The helper starts alongside the command, and the engine waits for it only when the command first calls Dagger. On 100 sequential nested execs this made the chain about 9% faster.
