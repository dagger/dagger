kind: Changed
body: |
  The engine now links a single Dang library: Dang SDK modules written in Dang
  1.0 (by default, those with an `engineVersion` before v0.21.5) run on Dang
  v2.3.0 in its Dang 1.0 mode instead of on the Dang v1 line.
