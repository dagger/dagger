kind: Changed
body: |
  Dang SDK modules evaluate with Dang 2.4. A module whose `dang.toml` declares
  no `dang` version (or that has no `dang.toml`) is pinned by its
  `engineVersion`: before v0.21.5 it is Dang 1.0, before v1.0.0-beta.26 Dang
  2.1, and from v1.0.0-beta.26 on Dang 2.4, where type patterns spell the
  non-null type they bind (`e: Error! =>`). Manifest v2 entrypoints that declare
  none stay on Dang 2.1.

  At every Dang version, bare `JSON` in a type is Dang's builtin JSON-text
  scalar, not Dagger's `JSON` scalar, which is `Dagger.JSON`; convert between
  them with a cast (`value :: Dagger.JSON!`). Module entrypoints keep declaring
  `JSON`. `toString`, interpolation and `print` render values as Dang literals:
  a Dagger object as its lazy query, not its ID (select `.id`), and data as
  Dang literals (use `JSON.encode` for JSON text).
time: 2026-11-10T04:30:00Z
