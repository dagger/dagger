body: |
  `GitRef.commit` and `GitRef.ref` are deprecated in favor of the new
  `commitSHA` and `name` fields, which resolve through the same underlying
  resolvers. Schema views older than v1.0.0-0 keep the undecorated fields they
  shipped with.
