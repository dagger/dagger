kind: Deprecated
body: |
  `Container.experimentalWithGPU` and `Container.experimentalWithAllGPUs` are
  deprecated in favor of `withGPU`. Both keep working in every API version.
  API versions before v1.0 keep the undecorated fields they shipped with.
  Per-device selection has no replacement yet; a portable design is still to
  be settled.
