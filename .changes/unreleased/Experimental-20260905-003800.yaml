kind: Experimental
body: |
  Rename the LLM history display API from `replay` to `emitHistory`.
  Use `EmitHistory` in Go and `emit_history` in Python, Rust, and Elixir.
  The previous name is removed without a deprecated alias.
  Recorded-response test model prefixes change from `replay/` and `replay-`
  to `recording/` and `recording-`.
