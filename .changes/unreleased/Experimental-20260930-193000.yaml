kind: Experimental
body: |
  Add `llmContent`, a builder for ordered text and media content outside any
  conversation: `llmContent().withText(...).withFile(...)`. A function exposed
  as an LLM tool can return `LLMContent`, and the model receives its blocks as
  the tool result's own content, e.g. a caption and a screenshot for it to
  look at.
