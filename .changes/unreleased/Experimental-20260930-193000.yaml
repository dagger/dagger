kind: Experimental
body: |
  Add `llmContentBlock` for building text and media content blocks without
  a conversation. Functions exposed as LLM tools can return an
  `LLMContentBlock` or a list of them, and the model receives the blocks as
  the tool result's own content, e.g. a screenshot for it to look at.
