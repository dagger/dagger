kind: Experimental
body: |
  Add `Workspace.withPatchFile`, which applies a Git patch to a workspace like
  `Directory.withPatchFile` does to a directory, including on a host-backed
  workspace. Paths in the patch are relative to the workspace root, whatever
  its cwd.

  Also add `Workspace.withoutFiles`, which removes several files in one step
  like `Directory.withoutFiles`.
time: 2026-10-02T20:00:00Z
