kind: Experimental
body: |
  Add `Artifact.workspace`, the workspace an artifact was discovered in, or null
  for an artifact without one, such as an LLM's bound tool objects.

  A module that fails to load now stands in for whatever it would hold: artifact
  filters such as `filterUri` keep its load failure when the module could hold
  what they select, so `asExpertise`, `asChangesets` and `asServices` fail with
  the load error instead of finding nothing, and `Workspace.resolve` names it.
  The load failure's address now uses the module's kebab-case name, like its
  artifacts.
