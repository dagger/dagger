kind: Fixed
body: |
  Applying a changeset now touches only the files it reports as changed.
  Regenerating a module used to re-report its entire generated context — files
  the SDK never rewrote included — as soon as one generated file actually
  changed, and `dagger generate` wrote all of them back out. Only the first
  generation of a module ever looked right.

  The paths a `Changeset` reports come from comparing content, so a file
  regenerated byte for byte is not listed. Applying, exporting, or reading
  `layer` off that changeset went through a filesystem-level diff instead,
  which counts a fresh modification time as a change on its own — which is
  what codegen output always has. Those three surfaces follow the reported
  paths now, so a changeset can no longer overwrite content it never claimed.
