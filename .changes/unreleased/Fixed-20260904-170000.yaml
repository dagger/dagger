kind: Fixed
body: |
  Long-lived sessions now reclaim closed nested-client runtimes after their
  requests and detached work finish. Telemetry is owned by the session and
  receives a final flush only after deferred cache cleanup completes, preventing
  memory growth and lost cleanup telemetry across repeated SDK invocations.
