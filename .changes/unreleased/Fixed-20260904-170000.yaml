kind: Fixed
body: |
  Long-lived sessions now reclaim closed nested-client runtimes after their
  requests and detached work finish. Trace/log telemetry is session-owned,
  client metric providers drain with their live runtimes, and final flushing
  waits for deferred cache cleanup, preventing memory growth and lost cleanup
  telemetry across repeated SDK invocations.
