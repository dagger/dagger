kind: Fixed
body: |
  Strip the final LF or CRLF from cmd:// secrets only when command output is
  a single line, so commands such as gh auth token work without an extra newline.
  Spaces and multiline output (including final newlines) are preserved;
  other secret providers are unchanged.
