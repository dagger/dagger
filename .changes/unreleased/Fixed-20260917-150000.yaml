kind: Fixed
body: |
  `dagger module settings` stores a string setting as a string even when the
  value reads as a number, boolean, or comma-separated list, so
  `dagger module settings go version 1.20` writes `version = "1.20"` instead of
  the float `1.2`. Quotes that wrap the whole value, as in `"1.20"`, are no
  longer kept as part of it.
time: 2026-09-17T15:00:00Z
