kind: Fixed
body: |
  A module's Dang entrypoint now receives a workspace built from its own
  module's context, with its working directory at the module, whichever source
  the module was loaded from: the repository for a git module, the directory
  for a directory module, and the loaded files for a local module. A module
  inside the caller's workspace used to receive the caller's workspace
  instead. A local module that reads a file above its own directory now
  declares that file in its includes. A local module registered under an SDK
  scope in the caller's config still gets the local clients that scope
  declares.
time: 2026-09-18T23:00:00Z
