kind: Fixed
body: |
  LLM requests now send a turn's tool results before any other user content
  that landed between the tool calls and their results, e.g. media appended
  by a tool that returned a conversation. Providers rejected that order on
  every later step (Anthropic: "tool_use ids were found without tool_result
  blocks immediately after"), leaving the conversation stuck.
