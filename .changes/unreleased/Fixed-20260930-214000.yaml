kind: Fixed
body: |
  Git repositories derived from a remote, such as a dirty or unpushed workspace
  snapshot or a commit on a remote workspace, now resolve refs they do not
  contain through that remote with its original authentication. Agent tools can
  fetch other branches of a private repository from the workspace they were
  given.
