kind: Fixed
body: Execs now get cgroup controllers (cpu, memory, io, pids…) when the engine container's entrypoint isn't PID 1, for example an engine run as a Dagger service or with `docker run --init`; the entrypoint moved only one process out of the root cgroup, so enabling the controllers failed.
