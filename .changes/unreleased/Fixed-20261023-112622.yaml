kind: Fixed
body: |
  Workspace searches work from Windows clients. A search rooted at the
  workspace (`/`) failed with "path cannot escape search root", which kept
  modules that discover files through `Workspace.search`, such as the
  dagger/python modules, from listing or running their checks. Results also
  come back slash-separated, as on Linux and macOS.
