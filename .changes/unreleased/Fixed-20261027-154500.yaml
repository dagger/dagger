kind: Fixed
body: |
  Honor `DAGGER_CLIENT_VERSION` on nested execs so generated module entrypoints
  can select the core API view their library targets. Nested clients that
  announce their own version keep that version. Inside modules, declared core
  views are capped at the running engine's view. Module context is preserved.
  Standalone clients keep their announced view.
