kind: Fixed
body: |
  Honor `DAGGER_CLIENT_VERSION` on nested execs so generated module entrypoints
  can select the core API view their library targets. Nested clients that
  announce their own version keep that version. Declared views are capped at
  the running engine's version while module context is preserved.
