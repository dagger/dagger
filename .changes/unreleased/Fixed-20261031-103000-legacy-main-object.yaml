kind: Fixed
body: |
  Modules declaring an engine version before v1.0.0-beta.22 find a main object
  spelled as the module's own type name, such as `K8STools` for module
  `k8s-tools` or `E2ETest` for `e2e-test`, as the Python SDK names it (and as
  `ModuleSource.naming`'s `typeNames` gives it), and serve it under that name.
  The legacy strcase rules normalized those names a second time and didn't
  recognize them. Every spelling recognized before still is. The in-repo Go
  SDK's codegen still picks its main struct by the old comparison.
time: 2026-10-31T10:30:00Z
