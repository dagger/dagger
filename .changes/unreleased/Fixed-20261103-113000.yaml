kind: Fixed
body: |
  An engine stop that outlived the graceful-stop budget no longer wipes the
  whole dagql cache on the next start: the final save and the clean-shutdown
  marker now run detached from the stop budget, so a slow stop keeps the
  cache it spent the run building.
