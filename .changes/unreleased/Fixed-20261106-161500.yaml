kind: Fixed
body: |
  `Directory.withTimestamps` and `File.withTimestamps` set the timestamps of
  symlinks themselves instead of following them. A dangling symlink no longer
  fails the call, and a symlink to a path outside the directory no longer
  changes that path's timestamps.
