kind: Fixed
body: |
  The engine starts again when an entry its image ships has expired.
  Engines of v1.0.0-beta.26 (since Nov 16, 2026) and v1.0.0-beta.27 (since
  Nov 17, 2026) fail every start, fresh or restarted, with "merge the engine
  image's entries: root N did not merge (expired true, retained false)": one
  of the Go module entries their images ship expired a week after the image
  was built. Upgrade to this release. Until then, those engines start with an
  empty directory mounted over /usr/local/share/dagger/entries, without the
  pre-warmed Go module entries.
time: 2026-11-17T12:45:00-08:00
