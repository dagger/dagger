kind: Fixed
body: |
  A fresh engine now gets every cache entry its image ships, however old the
  image. The engine merged each entry with the expiry the image's build gave
  it, and the Go SDK's go-includes helper expired a week after the image was
  built: a fresh engine from an older image left it out and built it again on
  its first Go module call.
