kind: Fixed
body: |
  The engine shrinks images given to an LLM to at most 2576px on the long edge
  when it stores them. Anthropic rejects every request of a conversation with
  more than 20 images once any of them is over 3000px, so one pasted Retina
  screenshot broke every turn after enough tool screenshots.
