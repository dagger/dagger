<text x="20.0" y="1478.0" text-anchor="start" class="small">Notes: each cake sums per-PR targeted workloads, each measured in its own session on a fresh engine; not one combined workload.</text>
<text x="20.0" y="1493.0" text-anchor="start" class="small">#15212 and #15213 share one focus (serialized contenthash trees); #15212 alone, against its own branch: 360 → 53 MiB.</text>
<text x="20.0" y="1508.0" text-anchor="start" class="small">#15226 frees memory only for Dang and dang-entrypoint Go modules; legacy Go/Python/TS runtimes keep receiver JSON via</text>
<text x="20.0" y="1523.0" text-anchor="start" class="small">session-owned currentFunctionCall / FunctionCall.parent results. #15218&#39;s idle-LoadTrace release is not measured (needs Cloud).</text>
