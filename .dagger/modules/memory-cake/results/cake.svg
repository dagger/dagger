<text x="20.0" y="54.0" text-anchor="start" class="sub">Focus bytes of the live Go heap (inuse_space, gc=1), BEFORE = fcce0f89 (main) vs AFTER = memory-cake-all @ 88dadbd5 (main + all memory PRs).</text>
