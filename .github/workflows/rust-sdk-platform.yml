name: Rust SDK Supported Platforms

on:
  pull_request:
    paths:
      - ".github/workflows/rust-sdk-platform.yml"
      - "sdk/rust/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rust-sdk-platform.yml"
      - "sdk/rust/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rust-sdk-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: rust-sdk-supported-${{ matrix.os-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os-name: linux
          - runner: macos-15
            os-name: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: sdk/rust
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and exercise the fixed native producer
        env:
          OBSERVATION_OS: ${{ matrix.os-name }}
        run: >-
          ./scripts/ci-platform-preflight.sh
          "platform-observation-$OBSERVATION_OS.json"
      - name: Upload the canonical native observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-sdk-native-${{ matrix.os-name }}
          path: sdk/rust/platform-observation-${{ matrix.os-name }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish the bounded supported-platform observation
        env:
          OBSERVATION_OS: ${{ matrix.os-name }}
          OBSERVATION_ARCH: ${{ runner.arch }}
        run: |
          {
            echo "## Rust SDK supported-platform observation"
            echo
            echo "- Revision: \`$GITHUB_SHA\`"
            echo "- Platform: \`$OBSERVATION_OS/$OBSERVATION_ARCH\`"
            echo "- Outcome: \`passed\`"
            echo "- Dagger / engine / Docker / other SDK invocations: \`0 / 0 / 0 / 0\`"
            echo "- Current SDK sign-off platform: \`yes\`"
            echo "- Windows support claimed: \`no\`"
          } >>"$GITHUB_STEP_SUMMARY"

  aggregate-supported:
    name: rust-sdk-supported-aggregate
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: sdk/rust
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download Linux and macOS observations
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: rust-sdk-native-*
          path: sdk/rust/native-observations
          merge-multiple: true
      - name: Admit the matching supported observation set
        run: |
          cargo build -p dagger-sdk-completeness --bin dagger-rust-sdk-platform --locked
          ./target/debug/dagger-rust-sdk-platform aggregate-supported \
            --scope completeness/conformance-scope.json \
            --input native-observations/platform-observation-linux.json \
            --input native-observations/platform-observation-macos.json \
            --output platform-observation-supported-set.json
      - name: Upload the bounded supported set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-sdk-native-supported-set
          path: sdk/rust/platform-observation-supported-set.json
          if-no-files-found: error
          retention-days: 7
