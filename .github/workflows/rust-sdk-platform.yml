name: Rust SDK Development Platforms

on:
  pull_request:
    paths:
      - ".github/workflows/rust-sdk-platform.yml"
      - "sdk/rust/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rust-sdk-platform.yml"
      - "sdk/rust/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rust-sdk-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: rust-sdk-development-${{ matrix.os-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os-name: linux
          - runner: macos-15
            os-name: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: sdk/rust
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and exercise the fixed native producer
        env:
          OBSERVATION_OS: ${{ matrix.os-name }}
        run: >-
          ./scripts/ci-platform-preflight.sh
          "platform-observation-$OBSERVATION_OS.json"
      - name: Publish the bounded development observation
        env:
          OBSERVATION_OS: ${{ matrix.os-name }}
          OBSERVATION_ARCH: ${{ runner.arch }}
        run: |
          {
            echo "## Rust SDK development observation"
            echo
            echo "- Revision: \`$GITHUB_SHA\`"
            echo "- Platform: \`$OBSERVATION_OS/$OBSERVATION_ARCH\`"
            echo "- Outcome: \`passed\`"
            echo "- Dagger / engine / Docker / other SDK invocations: \`0 / 0 / 0 / 0\`"
            echo "- Portable platform matrix admitted: \`no\`"
          } >>"$GITHUB_STEP_SUMMARY"
