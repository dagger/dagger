name: Rust SDK Security

on:
  pull_request: {}
  push:
    branches:
      - main
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/rust-sdk-platform.yml"
      - ".github/workflows/rust-sdk-security.yml"
      - ".github/workflows/rust-sdk-windows-preflight.yml"
      - "dagger.toml"
      - "core/schema/workspace_install.go"
      - "core/sdk/**"
      - "engine/distconsts/consts.go"
      - "internal/cmd/dagger/module_init.go"
      - "sdk/rust/**"
      - "toolchains/engine-dev/**"
      - "toolchains/rust-sdk-dev/**"
      - "toolchains/security/**"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rust-sdk-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-policy:
    name: rust-sdk-security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.19.9
      - name: Check dependencies and publication policy
        run: ./scripts/ci-security-preflight.sh dependencies
      - name: Check generated source and security boundaries
        run: ./scripts/ci-security-preflight.sh source-policy
      - name: Check packaged runtime metadata boundary
        working-directory: sdk/rust/runtime
        run: ../scripts/ci-security-preflight.sh runtime
      - name: Verify the public SDK package
        run: ./scripts/ci-security-preflight.sh packages
