name: Rust SDK Security

on:
  pull_request: {}
  push:
    branches:
      - main
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/rust-sdk-security.yml"
      - "dagger.toml"
      - "sdk/rust/**"
      - "toolchains/rust-sdk-dev/**"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rust-sdk-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-policy:
    name: rust-sdk-security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.19.9
      - name: Check dependency security and policy
        run: cargo deny check
