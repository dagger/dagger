name: Rust SDK Security

on:
  pull_request: {}
  push:
    branches:
      - main
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/rust-sdk-security.yml"
      - "dagger.toml"
      - "core/schema/workspace_install.go"
      - "core/sdk/**"
      - "engine/distconsts/consts.go"
      - "internal/cmd/dagger/module_init.go"
      - "sdk/rust/**"
      - "toolchains/engine-dev/**"
      - "toolchains/rust-sdk-dev/**"
      - "toolchains/security/**"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rust-sdk-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-policy:
    name: rust-sdk-security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.19.9
      - name: Check dependencies and publication policy
        run: |
          cargo metadata --no-deps --format-version 1 --locked >/dev/null
          cargo metadata --manifest-path examples/backend/Cargo.toml --no-deps --format-version 1 --locked >/dev/null
          cargo metadata --manifest-path examples/cli/Cargo.toml --no-deps --format-version 1 --locked >/dev/null
          cargo metadata --manifest-path examples/frontend/Cargo.toml --no-deps --format-version 1 --locked >/dev/null
          cargo deny check
      - name: Check generated source and security boundaries
        run: cargo test --workspace --all-features --locked
      - name: Check packaged runtime metadata boundary
        working-directory: sdk/rust/runtime
        env:
          DAGGER_SESSION_PORT: "1"
          DAGGER_SESSION_TOKEN: engine-free-static-check
        run: go test ./...
      - name: Verify the public SDK package
        run: |
          cargo package -p dagger-sdk-macros --locked
          cargo package -p dagger-sdk --all-features --locked --config 'patch.crates-io.dagger-sdk-macros.path="crates/dagger-sdk-macros"'
          cargo run -p dagger-sdk-completeness --bin dagger-rust-sdk-check --locked -- packages --workspace . --packages target/package
