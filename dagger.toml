[modules.changelog]
source = ".dagger/modules/changelog"
legacy-default-path = true

[modules.bootstrap]
source = ".dagger/modules/bootstrap"
legacy-default-path = true

[modules.cli]
source = ".dagger/modules/cli-dev"
legacy-default-path = true

[modules.dev]
source = ".dagger/modules/dev"

[modules.dev.settings]
# Linux default. Override per-invocation with --docker=$DOCKER_HOST when the
# active Docker context points somewhere else.
docker = "unix:///var/run/docker.sock"

[modules.docs]
source = ".dagger/modules/docs-dev"
legacy-default-path = true

[modules.elixir-client]
source = ".dagger/modules/elixir-client-dev"
legacy-default-path = true

[modules.engine-dev]
source = ".dagger/modules/engine-dev"
legacy-default-path = true

[modules.go-client]
source = ".dagger/modules/go-client-dev"
legacy-default-path = true

[modules.golang]
source = "github.com/dagger/go@5683fb4f7e2e909a453eba727fb982077d5d11b5"
legacy-default-path = true

[modules.golang.settings]
generate = "docs/current_docs/reference/cli"
# FIXME: this can be an actual list (dagger.json required a hack)
lint = ".,engine/distconsts,modules/daggerverse,sdk/go,.dagger/modules/cli-dev,.dagger/modules/docs-dev,.dagger/modules/engine-dev,.dagger/modules/go,.dagger/modules/release,!.dagger/modules/docs-dev/docusaurus,!.dagger/modules/engine-dev/notify,!.dagger/modules/release/apko,!.dagger/modules/release/gh,!.dagger/modules/release/registry-config,!.dagger/modules/release/testdata"
test = "e2e/**"

[modules.helm]
source = "github.com/dagger/helm@d0a7e172e8212b31c6061bb699495b1e8ba0958f"
legacy-default-path = true

[modules.helm.settings]
# The module installs the wolfi `helm` package as `helm~<version>`, and that
# package moved to the 4.x line, so 3.x versions no longer resolve. Charts are
# still packaged with helm 3 (see .dagger/modules/release/helm.go); revisit once
# the module can select the `helm-3` package.
version = "4.0.1"

[modules.java-client]
source = ".dagger/modules/java-client-dev"
legacy-default-path = true

[modules.markdown-lint]
source = "modules/markdownlint"
legacy-default-path = true

[modules.php-client]
source = ".dagger/modules/php-client-dev"
legacy-default-path = true

[modules.ps-analyzer]
source = "github.com/dagger/PsScriptAnalyzer@d87a12883dccd495bee98da9d2c20eb44b6f608d"
legacy-default-path = true

[modules.python-client]
source = ".dagger/modules/python-client-dev"
legacy-default-path = true

[modules.release]
source = ".dagger/modules/release"
legacy-default-path = true

[modules.rust-client]
source = ".dagger/modules/rust-client-dev"
legacy-default-path = true

[modules.security]
source = ".dagger/modules/security"
legacy-default-path = true

[modules.security.settings]
# Paths to exclude from the source tree before scanning.
ignore = [
  "bin",
  ".git",
  "docs",
  "sdk/rust/examples",
  "sdk/rust/crates/dagger-sdk/examples",
  "core/integration/testdata",
  "dagql/idtui/viztest",
]

[modules.shellcheck]
source = "github.com/dagger/shellcheck@34bcb268f4483fa31ea9e33b6a86aa7892144323"
legacy-default-path = true

[modules.test-split]
source = ".dagger/modules/test-split"
legacy-default-path = true

[modules.tla-check]
source = ".dagger/modules/tla-check"

[modules.typescript-client]
source = ".dagger/modules/typescript-client-dev"
legacy-default-path = true

[modules.dang-sdk]
source = "dagger.io/sdk/dang@main"

[modules.go-sdk]
source = "dagger.io/sdk/go@main"

[env.dev.modules.engine-lab]
source = ".dagger/modules/engine-lab"

[env.dev.modules.tui-qa]
source = ".dagger/modules/tui-qa"

[env.dev.modules.mcp-lab]
source = ".dagger/modules/mcp-lab"

[env.dev.modules.editor]
source = "github.com/vito/editor"

[sdks.dang]
module = "dang-sdk"

[sdks.dang.scopes.".dagger/modules/changelog"]
is-module = true

[sdks.dang.scopes.".dagger/modules/ci"]
is-module = true
clients = ["./.dagger/modules/engine-dev"]

[sdks.dang.scopes.".dagger/modules/dotnet-client-dev"]
is-module = true

[sdks.dang.scopes.".dagger/modules/elixir-client-dev"]
is-module = true
clients = ["./.dagger/modules/engine-dev", "./.dagger/modules/go"]

[sdks.dang.scopes.".dagger/modules/go-client-dev"]
is-module = true
clients = ["./.dagger/modules/engine-dev", "./modules/git-releaser", "./.dagger/modules/go"]

[sdks.dang.scopes.".dagger/modules/java-client-dev"]
is-module = true
clients = ["./.dagger/modules/engine-dev"]

[sdks.dang.scopes.".dagger/modules/security"]
is-module = true
clients = ["./.dagger/modules/engine-dev"]

[sdks.dang.scopes.".dagger/modules/test-split"]
is-module = true
clients = ["./.dagger/modules/engine-dev"]

[sdks.dang.scopes.".dagger/modules/typescript-client-dev"]
is-module = true
clients = ["./cmd/codegen", "./.dagger/modules/engine-dev", "./.dagger/modules/go"]

[sdks.dang.scopes."cmd/codegen"]
is-module = true
clients = ["./.dagger/modules/go"]

[sdks.dang.scopes."modules/markdownlint"]
is-module = true
name = "markdown-lint"

[sdks.go]
module = "go-sdk"

[sdks.go.scopes.".dagger/modules/cli-dev"]
is-module = true
clients = ["./modules/alpine", "./.dagger/modules/go"]

[sdks.go.scopes.".dagger/modules/docs-dev"]
is-module = true
clients = ["./.dagger/modules/cli-dev", "./.dagger/modules/docs-dev/docusaurus", "./.dagger/modules/engine-dev", "./.dagger/modules/go"]

[sdks.go.scopes.".dagger/modules/docs-dev/docusaurus"]
is-module = true

[sdks.go.scopes.".dagger/modules/engine-dev"]
is-module = true
clients = ["./modules/alpine", "./cmd/codegen", "./.dagger/modules/cli-dev", "./.dagger/modules/go", "./modules/wolfi", "./.dagger/modules/engine-dev/notify"]

[sdks.go.scopes.".dagger/modules/engine-dev/notify"]
is-module = true

[sdks.go.scopes.".dagger/modules/php-client-dev"]
is-module = true
clients = ["./.dagger/modules/engine-dev", "./modules/git-releaser"]

[sdks.go.scopes.".dagger/modules/python-client-dev"]
is-module = true
clients = ["./.dagger/modules/engine-dev", "./.dagger/modules/python-client-dev/dockerd", "github.com/dagger/pytest@cdf6dc0bce0fe8fdf87c6b26ecd991e6f96200b0", "./modules/wolfi"]

[sdks.go.scopes.".dagger/modules/python-client-dev/dockerd"]
is-module = true

[sdks.go.scopes.".dagger/modules/release"]
is-module = true
clients = ["./.dagger/modules/changelog", "./.dagger/modules/cli-dev", "./.dagger/modules/docs-dev", "./.dagger/modules/engine-dev", "./.dagger/modules/release/gh", "./.dagger/modules/go-client-dev", "./.dagger/modules/engine-dev/notify", "./.dagger/modules/php-client-dev", "./.dagger/modules/python-client-dev", "./.dagger/modules/elixir-client-dev", "./.dagger/modules/rust-client-dev", "./.dagger/modules/typescript-client-dev", "./modules/wolfi"]

[sdks.go.scopes.".dagger/modules/release/apko"]
is-module = true
clients = ["./.dagger/modules/release/registry-config"]

[sdks.go.scopes.".dagger/modules/release/gh"]
is-module = true
clients = ["./.dagger/modules/release/apko"]

[sdks.go.scopes.".dagger/modules/release/registry-config"]
is-module = true

[sdks.go.scopes.".dagger/modules/rust-client-dev"]
is-module = true
clients = ["./.dagger/modules/engine-dev"]

[sdks.go.scopes.".dagger/modules/tla-check"]
is-module = true

[sdks.go.scopes."modules/alpine"]
is-module = true

[sdks.go.scopes."modules/git-releaser"]
is-module = true
clients = ["./modules/alpine"]

[sdks.go.scopes."modules/wolfi"]
is-module = true
clients = ["./modules/alpine"]

[sdks.dang.scopes.".dagger/modules/dev"]
clients = ["./.dagger/modules/engine-dev", "./.dagger/modules/cli-dev"]
is-module = true

[sdks.go.scopes.".dagger/modules/go"]
clients = ["./modules/wolfi"]
is-module = true

[modules.dagger-dev]
source = ".dagger/modules/dagger-dev"
entrypoint = true
