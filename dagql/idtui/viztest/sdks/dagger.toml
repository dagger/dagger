# Fixture modules for the external SDKs' golden tests (see
# dagql/idtui/golden_test.go). This is a workspace of its own so that
# regenerating them never touches the repository's dagger.toml: run
# `dagger generate` from this directory.

[modules.go-sdk]
# go-sdk#113: the dispatcher reports a function's error in the file
# (DAGGER_FUNCTION_ERROR_PATH) the engine gives a call's process. It also
# builds the shared dep, a go-sdk module.
source = "github.com/dagger/go-sdk@5ed109c2c1e51086a777ada185d8c5b0d1215d02"

[modules.python-sdk]
# python-sdk#93: the dispatcher reports a function's error in the file
# (DAGGER_FUNCTION_ERROR_PATH) the engine gives a call's process, and then
# shows a function's errors with a short traceback, the user's frames only,
# and nothing for an API error whose origin the engine shows.
source = "github.com/dagger/python-sdk@1927020b371bf86afaa8463d67978228210d43d1"

[modules.typescript-sdk]
# typescript-sdk#144, on top of dagger/typescript-sdk#143 (generated Dang
# entrypoints name cache policies in GraphQL's spelling): the dispatcher
# returns its result in a file rather than on stdout, which the function's
# logs share, reports a function's error in the file
# (DAGGER_FUNCTION_ERROR_PATH) the engine gives a call's process, and shows a
# short stack trace of the module's own frames, and nothing for an API error
# whose origin the engine shows. It loads the module's code itself, so a
# module that doesn't compile fails with esbuild's error.
source = "github.com/dagger/typescript-sdk@28249a50a694bd4a084348bbaf8fc3e85046662a"

[modules.php-sdk]
# php-sdk#49, on top of dagger/php-sdk#48 (sdk-helpers v1.0.11: v1.0.9 no
# longer compiles under current Dang): the dispatcher reports a function's
# error in the file (DAGGER_FUNCTION_ERROR_PATH) the engine gives a call's
# process, with a short stack trace of the module's own frames, and nothing
# for an API error whose origin the engine shows; a fatal error, exhausted
# memory included, is reported too. The entrypoint declares prebuild, the
# module's Composer install.
source = "github.com/dagger/php-sdk@ad9445a92c36e35a3d913c570239f9ed7b7fd257"

[modules.java-sdk]
# java-sdk#47: the dispatcher reports a function's error in the file
# (DAGGER_FUNCTION_ERROR_PATH) the engine gives a call's process, with a short
# stack trace of the module's own frames, and nothing for an API error whose
# origin the engine shows. The entrypoint declares prebuild, and Maven builds
# the jar quietly in an exec of its own, so a build failure shows the
# compiler's errors.
source = "github.com/dagger/java-sdk@f25650f95356764c9bf7e3b1bdeec013685e112b"

[modules.dang-sdk]
source = "github.com/dagger/dang-sdk@14ba9d349167cb32b3a06f4229f534509a30ac62"

[modules.ruby-sdk]
# ruby-sdk#11: the entrypoint marks the dispatcher's exec, and no other, as
# the module process (DAGGER_MODULE_CALL_DIGEST) and declares prebuild, the
# module's gems install; the dispatcher reports a function's error in the file
# (DAGGER_FUNCTION_ERROR_PATH) the engine gives a call's process, with a short
# trace of the module's own frames in Ruby's own form, and nothing for an API
# error whose origin the engine shows.
source = "github.com/dagger/ruby-sdk@6ba32f19377fdc188eb759f2ecdae80da46beebf"

[sdks.go]
module = "go-sdk"

[sdks.python]
module = "python-sdk"

[sdks.typescript]
module = "typescript-sdk"

[sdks.php]
module = "php-sdk"

[sdks.java]
module = "java-sdk"

[sdks.dang]
module = "dang-sdk"

[sdks.ruby]
module = "ruby-sdk"

