# Fixture modules for the external SDKs' golden tests (see
# dagql/idtui/golden_test.go). This is a workspace of its own so that
# regenerating them never touches the repository's dagger.toml: run
# `dagger generate` from this directory.

[modules.go-sdk]
# go-sdk#113: the dispatcher reports a function's error in the file
# (DAGGER_FUNCTION_ERROR_PATH) the engine gives a call's process. It also
# builds the shared dep, a go-sdk module.
source = "github.com/dagger/go-sdk@5ed109c2c1e51086a777ada185d8c5b0d1215d02"

[modules.python-sdk]
# python-sdk#93: the dispatcher reports a function's error in the file
# (DAGGER_FUNCTION_ERROR_PATH) the engine gives a call's process, and then
# shows a function's errors with a short traceback, the user's frames only,
# and nothing for an API error whose origin the engine shows.
source = "github.com/dagger/python-sdk@1927020b371bf86afaa8463d67978228210d43d1"

[modules.typescript-sdk]
# A fork: generated Dang entrypoints name cache policies in TypeScript's
# spelling, which fails to load (dagger/typescript-sdk#143).
source = "github.com/vito/typescript-sdk@23a6ec5cba3e81539bd09def8a9fc3c2bae9efac"

[modules.php-sdk]
# A fork: php-sdk's sdk-helpers dependency no longer compiles under current
# Dang (dagger/php-sdk#48).
source = "github.com/vito/php-sdk@115d8d91eef6b49012ea66112adc0af0ef5fc48c"

[modules.java-sdk]
# java-sdk#47: the dispatcher reports a function's error in the file
# (DAGGER_FUNCTION_ERROR_PATH) the engine gives a call's process, with a short
# stack trace of the module's own frames, and nothing for an API error whose
# origin the engine shows. The entrypoint declares prebuild, and Maven builds
# the jar quietly in an exec of its own, so a build failure shows the
# compiler's errors.
source = "github.com/dagger/java-sdk@344e6cf29bb1730b3d687bec31fbcdcd236005d6"

[modules.dang-sdk]
source = "github.com/dagger/dang-sdk@14ba9d349167cb32b3a06f4229f534509a30ac62"

[sdks.go]
module = "go-sdk"

[sdks.python]
module = "python-sdk"

[sdks.typescript]
module = "typescript-sdk"

[sdks.php]
module = "php-sdk"

[sdks.java]
module = "java-sdk"

[sdks.dang]
module = "dang-sdk"

[sdks.go.scopes.dep]
is-module = true
name = "sdk-dep"

[sdks.go.scopes.dep.settings]
template = "empty"

[sdks.go.scopes.go]
is-module = true
name = "viztest-go"
clients = ["./dep"]

[sdks.go.scopes.go.settings]
template = "empty"

[sdks.python.scopes.python]
is-module = true
name = "viztest-python"
clients = ["./dep"]

[sdks.typescript.scopes.typescript]
is-module = true
name = "viztest-typescript"
clients = ["./dep"]

[sdks.php.scopes.php]
is-module = true
name = "viztest-php"
clients = ["./dep"]

[sdks.java.scopes.java]
is-module = true
name = "viztest-java"
clients = ["./dep"]

[sdks.dang.scopes.dang]
is-module = true
name = "viztest-dang"
clients = ["./dep"]
