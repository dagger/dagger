\* ACCEPTED FINDING: NoSpuriousErrors is expected to be violated on
\* current code by a publisher's own release failing an innocent
\* cross-session reader. No handles, no injections: two sessions, one
\* call. s1 publishes a child, then publishes a parent and begins
\* attaching it; s2's lookup selects the parent while its barrier is
\* open and parks at the read barrier; release marks s1 between the
\* attachment hook's target selection and its claim
\* (attachResult -> trackSessionResult), the claim is refused, the
\* attachment fails deterministically, the barrier closes with the
\* error, and s2 - a live session that injected nothing - surfaces it
\* as its own failure. Same defect family as the fixed decode_cancel
\* finding; the analogous fix classifies a publisher-release attachment
\* failure so parked readers convert to a miss. Red until that ruling.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1, s2}
    s1 = s1
    s2 = s2
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 3
    MaxResults = 2
    Handles = {}
    AllowRelease = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
SYMMETRY Symm
INVARIANTS NoSpuriousErrors
