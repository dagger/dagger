\* A session's release manufacturing failures for live, innocent callers
\* through the attachment machinery, now fixed and held green. No
\* handles, no injections: two sessions, one call. The one reachable
\* window: the publisher's own release marks between the attachment
\* hook's target selection and its claim; the claim is refused, the
\* attachment fails, and the barrier closes with the classified
\* producer-release error, so a parked cross-session hit reader
\* converts to a miss and executes the call itself
\* (ReadBarrierRefusalMiss) instead of surfacing the foreign release as
\* its own failure, while the publishing session's own callers keep the
\* release refusal and genuine attachment failures keep propagating.
\* The formerly tracked collected-target windows are unreachable here:
\* attachment targets are pinned for the session (PinnedForSession,
\* mirroring the code's claim-at-acquisition invariant), so no other
\* session's release can collect a target out from under its claim - a
\* companion unreachability check over this complete space confirms a
\* live session's selected target is never found collected.
\*
\* Scenario scope (2026-08-31): only the publisher session s1 releases
\* (the reader session's release is not part of the question) and
\* persistable intent is off (persisted edges play no role here). The
\* unscoped configuration is the one-time exhaustive record: ~863M
\* distinct states, ~2h wall (the README figure, kept as the coverage
\* record); the scoped space is 26,213,049 distinct states, under three
\* minutes wall, and both evidence arms stay live at this scope. Naive
\* re-bounding to MaxInvocations=2 is ruled out (design-time
\* measurement, 2026-08-31): the classification-drop re-break
\* PASSES at that bound (666,999 distinct states either way), so the
\* mechanism under test would be unreachable. Session symmetry is
\* deliberately NOT declared: ReleaseSessions = {s1} makes sessions
\* non-interchangeable (SymmCalls would be sound but is vacuous with one
\* call).
\*
\* Expected: pass. Re-break evidence at this scope (2026-08-31):
\* dropping the barrier-error classification (attachErrRefusal forced
\* FALSE at PubAttachFailCloseBarrier) turns this red on
\* NoSpuriousErrors with the original reader-victim trace, and the
\* classified barrier error itself stays reachable (probe "no result
\* ever carries attachErrRefusal" is violated).
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1, s2}
    s1 = s1
    s2 = s2
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 3
    MaxResults = 2
    Handles = {}
    AllowRelease = TRUE
    ReleaseSessions = {s1}
    PersistableIntent = FALSE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS NoSpuriousErrors
