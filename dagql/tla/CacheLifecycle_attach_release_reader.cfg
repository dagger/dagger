\* A session's release manufacturing failures for live, innocent callers
\* through the attachment machinery, now fixed and held green. No
\* handles, no injections: two sessions, one call. The one reachable
\* window: the publisher's own release marks between the attachment
\* hook's target selection and its claim; the claim is refused, the
\* attachment fails, and the barrier closes with the classified
\* producer-release error, so a parked cross-session hit reader
\* converts to a miss and executes the call itself
\* (ReadBarrierRefusalMiss) instead of surfacing the foreign release as
\* its own failure, while the publishing session's own callers keep the
\* release refusal and genuine attachment failures keep propagating.
\* The formerly tracked collected-target windows are unreachable here:
\* attachment targets are pinned for the session (PinnedForSession,
\* mirroring the code's claim-at-acquisition invariant), so no other
\* session's release can collect a target out from under its claim - a
\* companion unreachability check over this complete space confirms a
\* live session's selected target is never found collected. Expected:
\* pass. Re-break evidence: dropping the barrier-error classification
\* (attachErrRefusal never set) turns this red on NoSpuriousErrors with
\* the original reader-victim trace.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1, s2}
    s1 = s1
    s2 = s2
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 3
    MaxResults = 2
    Handles = {}
    AllowRelease = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
SYMMETRY Symm
INVARIANTS NoSpuriousErrors
