\* The core kernel with no external events and no injected failures: two
\* sessions, two calls, every safety property. Expected: pass.
\* ReaderCanCancel stays off: reader cancellation triggers the hit-path
\* rollback asymmetry (see the rollback config), which desyncs the
\* ownership count in the current code.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1, s2}
    s1 = s1
    s2 = s2
    Calls = {cA, cB}
    cA = cA
    cB = cB
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    AllowRelease = FALSE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
SYMMETRY Symm
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection ReturnedLive ReturnedOwned NoHalfAttachedRead PersistableIntentDurable NoLostCancels NoSpuriousErrors NoOrphanEdgesAtQuiescence
