\* A reader's context is canceled inside the persisted-decode
\* singleflight: the decode leader is canceled mid-decode (before or
\* after DecodeInstall), or a parked joiner cancels. Expected: pass.
\*
\* Contract under test: ensurePersistedHitValueLoaded runs the decode on
\* the leader's own request context, and finishPersistDecode latches the
\* resulting context error together with a retry classification
\* (persistDecodeRetry, computed by lazyEvalErrorCausedByContext). A
\* parked joiner that wakes on a departed leader's cancellation retries
\* - returns the installed value, rejoins, or leads afresh - instead of
\* returning the foreign error as its own (NoSpuriousErrors), and never
\* relabels it as its own cancellation (CancelOnlyOwn). A cancellation
\* after the install additionally sets persistLeaseSyncPending, so the
\* next demand retries only the lease sync instead of serving the value
\* over an incompletely synchronized lease set. The lazy singleflight
\* got the same shape in #13938 (waitForLazyEvaluation); the decode
\* singleflight now matches it.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    Handles = {}
    AllowRelease = FALSE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelPartDelegation = FALSE
    ModelPersistence = TRUE
    ImportInit = TRUE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = TRUE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS TypeOK OwnershipExact NoUnderflow DecodeMutualExclusion ReturnedLive NoSpuriousErrors CancelOnlyOwn
