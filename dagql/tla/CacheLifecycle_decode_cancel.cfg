\* A reader's context is canceled inside the persisted-decode singleflight:
\* the decode leader is canceled mid-decode, or a parked joiner cancels.
\* ACCEPTED FINDING. Expected: NoSpuriousErrors is violated.
\*
\* Defect: ensurePersistedHitValueLoaded runs the decode on the leader's
\* own request context (DecodeResult on ContextWithCall(ctx, call), then
\* syncResultSnapshotLeases on ctx; no WithoutCancel), and
\* finishPersistDecode latches the resulting context error exactly like a
\* broken payload. A joiner parked on persistDecodeWaitCh wakes, reads the
\* latched error, and returns it as its own failure, so one caller's
\* cancellation becomes another caller's error. Two consequences, by where
\* the cancellation lands (both arms of DecodeLeadCancel):
\*   1. inside DecodeResult: the payload stays encoded and the next demand
\*      leads a fresh attempt, but the joiners already parked have failed.
\*   2. inside syncResultSnapshotLeases, after the decoded value was
\*      installed under payloadMu: the payload is decoded, later readers
\*      take the fast path and never join, the joiners already parked
\*      fail, and the result's owner leases are never attached because
\*      nothing retries the sync.
\* The lazy singleflight fixed this class in waitForLazyEvaluation
\* (#13938); the decode singleflight was not changed. Shortest trace:
\* leader leads, joiner joins, DecodeLeadCancel latches "cancel",
\* DecodeWake sends the joiner to decodeErr, DecodeFailHit, operation exit
\* as "failed".
\*
\* TLC stops at the first violation, so the other invariants listed here
\* are checked only on the states explored before it. decode_cancel_gates
\* runs the same scenario without NoSpuriousErrors and is the green gate.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    AllowRelease = FALSE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = TRUE
    ImportInit = TRUE
    ModelNestedCalls = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = TRUE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS TypeOK OwnershipExact NoUnderflow DecodeMutualExclusion ReturnedLive NoSpuriousErrors CancelOnlyOwn
