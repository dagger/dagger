\* The decode_cancel scenario without the finding's invariant, so TLC
\* explores the whole state space and these gates hold in every state:
\* a canceled decode leader or joiner keeps ownership exact, at most one
\* decode runs per result, and every cancellation an invocation reports is
\* its own (CancelOnlyOwn). Expected: pass.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    AllowRelease = FALSE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = TRUE
    ImportInit = TRUE
    ModelNestedCalls = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = TRUE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS TypeOK OwnershipExact NoUnderflow DecodeMutualExclusion ReturnedLive CancelOnlyOwn
