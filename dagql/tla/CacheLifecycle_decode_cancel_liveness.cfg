\* The decode_cancel scenario under fair scheduling: a canceled decode
\* leader clears the wait channel before it leaves, so a parked joiner
\* always wakes (DecodeWake is fair), retries the departed leader's
\* cancellation - returning the installed value, rejoining, or leading
\* afresh - and eventually terminates; no caller wedges and no retry
\* loops forever (each invocation cancels at most once, and after the
\* last cancellation fair waiter progress completes the remaining decode
\* or sync-only attempt and finishes). Cancellation
\* actions carry no fairness: they are possibilities. Expected: pass.
\* MaxResults is 4 for the same reason as persist_liveness: imports can
\* occupy two slots, and a fresh publication blocked by the bound would
\* report a wedge that is purely the bound.
SPECIFICATION LiveSpec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 4
    Handles = {}
    AllowRelease = FALSE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    ModelPartDelegation = FALSE
    ModelPersistence = TRUE
    ImportInit = TRUE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = TRUE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
PROPERTY EventuallyTerminal
