\* The decode_cancel scenario under fair scheduling: a canceled decode
\* leader clears the wait channel before it leaves, so a parked joiner
\* always wakes (DecodeWake is fair) and terminates, with the latched error
\* today; no caller wedges. Cancellation actions carry no fairness: they
\* are possibilities. Expected: pass. MaxResults is 4 for the same reason
\* as persist_liveness: imports can occupy two slots, and a fresh
\* publication blocked by the bound would report a wedge that is purely
\* the bound.
SPECIFICATION LiveSpec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 4
    AllowRelease = FALSE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = TRUE
    ImportInit = TRUE
    ModelNestedCalls = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = TRUE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
PROPERTY EventuallyTerminal
