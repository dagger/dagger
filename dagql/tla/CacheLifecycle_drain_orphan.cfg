\* The orphan_edges outcome with the server's drain HONORED: a nested
\* call's session-edge claim lands after release already ran (once, ever,
\* per session). The re-created record and its count survive at quiescence
\* with nothing left to release them. Expected: NoOrphanEdgesAtQuiescence
\* violated.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 1
    AllowRelease = TRUE
    DrainOnRelease = TRUE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = TRUE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS NoOrphanEdgesAtQuiescence
