\* The flush_inflight outcome with every session released and the drain
\* honored: an executor-nested call can still adopt a clean persisted result
\* and hold transient publication ownership because the drain does not cover
\* the executor.
\* Expected: FlushCleanCapture violated.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 1
    AllowRelease = TRUE
    DrainOnRelease = TRUE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = TRUE
    ImportInit = FALSE
    ModelNestedCalls = TRUE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS FlushCleanCapture
