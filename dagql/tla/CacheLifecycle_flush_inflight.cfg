\* Flush racing an unfinished publication: publication is split across
\* critical sections, so the shutdown snapshot can capture a result whose
\* attach barrier is still open, retained partly by a transient handoff
\* hold. Expected: FlushCleanCapture violated.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    AllowRelease = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = TRUE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS FlushCleanCapture
