\* Drained shutdown, flush, restart, new work: ownership is re-established
\* from the snapshot, the flush captures only clean state, and nothing
\* mid-publication is laundered into a servable entry. Expected: pass.
\* No executor-nested calls here; the flush_drained config shows what they
\* break.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    AllowRelease = TRUE
    DrainOnRelease = TRUE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = TRUE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection FlushCleanCapture FlushReferentialIntegrity NoLaunderedServe
