\* Drained shutdown, flush, restart, new work: ownership is re-established
\* from the snapshot, the flush captures only clean state, and nothing
\* mid-publication is laundered into a servable entry. Expected: pass.
\* No executor-nested calls here; the flush_drained config shows what they
\* break.
\* Session-resource gating runs here too (Handles = {h1}): flushed rows
\* carry handles and the restart recompute must land every kept row on its
\* transitive requirement; RequiredExact and ReturnedGated gate that.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    Handles = {h1}
    h1 = h1
    AllowRelease = TRUE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = TRUE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelPartDelegation = FALSE
    ModelPersistence = TRUE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection FlushCleanCapture FlushReferentialIntegrity NoLaunderedServe ReturnedLive RequiredExact ReturnedGated
