\* Lazy evaluation with callback failures injected: at most one callback per
\* result, success permanent, failure and foreign cancellation retryable,
\* accounting exact. Two callers cover leader/joiner exclusion; the separate
\* stale-cancellation check retains its three-caller scenario. A one-time
\* exhaustive three-caller run of this configuration on the merged model
\* passed at 78,792,507 distinct states (2026-08-21); it stays at two
\* callers here because that cost is disproportionate for CI.
\* Expected: pass.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    Handles = {}
    AllowRelease = FALSE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = TRUE
    MaxEvals = 2
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    ModelPartDelegation = FALSE
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = TRUE
    DecodeCanFail = FALSE
INVARIANTS TypeOK LazyMutualExclusion LazySuccessPermanent OwnershipExact NoStaleCancelError EvalDoneComplete LazyCompleteSettled
