    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ModelLazy = TRUE
    ModelLazySingleflight = TRUE
    LazyCanFail = TRUE
    MaxEvals = 3
    ModelPersistence = FALSE
    ImportInit = FALSE
    DecodeCanFail = FALSE
INVARIANTS TypeOK LazyMutualExclusion LazySuccessPermanent OwnershipExact
