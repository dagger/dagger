\* Per-part evaluation (stage 2), base shape: one refined result with a
\* cheap metadata group (gMeta) and the exec's joint output group (gOut)
\* filling the rootfs and exec-meta parts, callback failures injected.
\* Three evaluators demand arbitrary parts. Checks the per-(result, group)
\* generalizations of every lazy invariant, joint-group completion (one
\* gOut attempt fills both pFS and pXMeta - their evaluators join the same
\* attempt), and that an evaluator only ever acts on its part's own group
\* (PartServedByItsGroup). No prerequisite ordering here (GroupNeeds is
\* empty); lazy_parts_prereq adds it. Reachability evidence recorded at
\* introduction (2026-08-31): two groups of one result running bodies
\* concurrently is reachable (probe invariant "never both running"
\* violated), and a group failing while its sibling group is complete is
\* reachable (probe "no failed evaluator while gMeta complete" violated).
\* Re-break evidence: weakening EvalNoWork to trust the consumed callback
\* without the group's own syncPending check (returning done unlatched)
\* trips EvalDoneComplete; weakening its completion read to any-group
\* completion (a stale result-level latch) also trips EvalDoneComplete.
\* Expected: pass.
