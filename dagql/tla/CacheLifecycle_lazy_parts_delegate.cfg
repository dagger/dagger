\* Cross-result delegation: a running group body demands parts of its
\* result's dependency (EvalDelegateDemand), which is what real delegation
\* bodies do (delegateContainerPart: EvaluateParts(parent, part) from
\* inside the child's body) and what the model never covered before stage
\* 2 made it load-bearing. Two invocations so the second call's fn can
\* inner-load the first result and publish with a dependency edge on it;
\* release is allowed: a delegation body mid-flight while the session
\* releases must keep the session out of collection (its internal
\* evaluator holds an operation token, the body holds the group's
\* callback token), and the parent is pinned by the dependency edge.
\* Internal evaluators need no session edge on their target. The
\* singleton group shape: delegation is a cross-result mechanism, and
\* group multiplicity is covered by lazy_parts / lazy_parts_prereq;
\* multi-group shapes here exceeded the run budget (the three-part shape
\* was killed past 45M distinct states and the two-part shape past 79M,
\* both still growing, 2026-08-31); persistable intent is off because
\* persisted edges play no role in the delegation question. Reachability
\* evidence recorded at introduction (2026-08-31): an internal evaluator
\* spawned by a running body reaching "done" is reachable (probe "no
\* internal evaluator terminates done" violated). Expected: pass.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA, cB}
    cA = cA
    cB = cB
    ClassOf <- DistinctClasses
    MaxInvocations = 2
    MaxResults = 2
    Handles = {}
    AllowRelease = TRUE
    ReleaseSessions <- AllSessions
    PersistableIntent = FALSE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = TRUE
    MaxEvals = 2
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelPartDelegation = TRUE
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS TypeOK OwnershipExact LazyAttemptDefersCollection EvalDoneComplete LazyCompleteSettled LazyMutualExclusion
