\* lazy_release's question with two groups and the prerequisite ordering:
\* per-group callback attempts outlive their waiters while the session is
\* released. Each group's attempt token defers collection until that
\* group's callback goroutine exits (several tokens can be in flight for
\* one result now - one per group); the outer Evaluate operations obey
\* late-success refusal, and release interleaving with the two-phase
\* resolution (settle gMeta, then demand gOut) refuses cleanly at either
\* phase. Expected: pass.
SPECIFICATION LiveSpec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 1
    MaxResults = 1
    Handles = {}
    AllowRelease = TRUE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = TRUE
    MaxEvals = 2
    LazyGroups <- ContainerGroups
    LazyParts <- ContainerParts
    PartGroupOf <- ContainerPartGroupOf
    GroupNeeds <- ContainerGroupNeeds
    ModelContainerPartPersistence = FALSE
    ModelPartDelegation = FALSE
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS TypeOK ReturnedLive LazyAttemptDefersCollection OwnershipExact EvalDoneComplete LazyCompleteSettled LazyMutualExclusion
PROPERTY DeferredReleaseEventuallyCompletes
