\* A healthy Evaluate caller joins an attempt whose previous waiters caused
\* callback cancellation, observes that foreign cancellation, and retries
\* without returning it. Expected: pass.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 1
    MaxResults = 1
    Handles = {}
    AllowRelease = FALSE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = TRUE
    MaxEvals = 3
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelPartDelegation = FALSE
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS TypeOK LazyMutualExclusion LazySuccessPermanent OwnershipExact NoStaleCancelError EvalDoneComplete LazyCompleteSettled
