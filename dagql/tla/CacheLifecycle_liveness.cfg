\* Fair scheduling, no external events, no failures: every issued call
\* eventually terminates. Expected: pass.
SPECIFICATION LiveSpec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    Handles = {}
    AllowRelease = FALSE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelPartDelegation = FALSE
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
PROPERTY EventuallyTerminal
