\* A session-edge claim landing around release: trackSessionResult's second
\* critical section re-checks only that the result is registered, so an
\* increment can land after the release wiped the record - retention that
\* nothing will ever release. Expected: NoOrphanEdgesAtQuiescence
\* violated.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 1
    MaxResults = 1
    AllowRelease = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS NoOrphanEdgesAtQuiescence
