\* Mutation: a fn that completes successfully while a waiter is admitted
\* delegates release of its shared leases to the waiters, and a last waiter
\* that leaves through cancellation never releases them. Expected: violate
\* SharedLeaseReleasedWhenRetired.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1, s2}
    s1 = s1
    s2 = s2
    Calls = {cA, cB}
    cA = cA
    cB = cB
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    AllowRelease = FALSE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = TRUE
    Handles = {}
    ModelLateDeps = FALSE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelPartDelegation = FALSE
    ModelContainerPartPersistence = FALSE
SYMMETRY Symm
INVARIANTS TypeOK SharedLeaseReleasedWhenRetired
