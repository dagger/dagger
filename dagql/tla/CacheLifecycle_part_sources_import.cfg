\* Part sources on restored rows (the lazy-import path). lazy_import's
\* imported starting graphs, without release, with offers arriving late: a
\* restored row arms whenever it has a recipe, and a demand after an offer
\* arrives goes managed unless a native attempt is in flight.
\* Expected: pass.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 1
    MaxResults = 2
    Handles = {}
    AllowRelease = FALSE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    AllowExpire = FALSE
    ModelMerge = FALSE
    ModelLazy = TRUE
    MaxEvals = 2
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    SharedSections = "atomic"
    ModelPartDelegation = FALSE
    ModelPersistence = TRUE
    ImportInit = TRUE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = TRUE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
    ModelOffers <- OffersOn
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection LazyMutualExclusion LazySuccessPermanent NoStaleCancelError EvalDoneComplete LazyCompleteSettled ReturnedLive OnePartWriter
PROPERTY ManagedSticky ManagedOnlyWithSource NativeRunStaysNative
