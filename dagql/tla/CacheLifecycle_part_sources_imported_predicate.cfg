\* Mutation of part_sources_import: the old predicate - an imported row goes managed
\* because it is imported, not for an offer or as a shell
\* (ShellPredicateGuard off), so a decoded row with no address, armed or
\* not, leaves the native path.
\* Expected: violates ManagedOnlyWithSource.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 1
    MaxResults = 2
    Handles = {}
    AllowRelease = FALSE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    AllowExpire = FALSE
    ModelMerge = FALSE
    ModelLazy = TRUE
    MaxEvals = 2
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    SharedSections = "atomic"
    ModelPartDelegation = FALSE
    ModelPersistence = TRUE
    ImportInit = TRUE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = TRUE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
    ModelOffers <- OffersOn
    ShellPredicateGuard <- GuardOff
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection LazyMutualExclusion LazySuccessPermanent NoStaleCancelError EvalDoneComplete LazyCompleteSettled ReturnedLive OnePartWriter
PROPERTY ManagedSticky ManagedOnlyWithSource NativeRunStaysNative
