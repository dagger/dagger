\* Mutation of part_sources_import: a late offer is installed over a running native
\* evaluation - a demand goes managed while a native attempt is in flight
\* (AcquireRunningGuard off) and acquisition takes a part whose group is
\* running (TryAcquireGuard off).
\* Expected: violates OnePartWriter.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 1
    MaxResults = 2
    Handles = {}
    AllowRelease = FALSE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    AllowExpire = FALSE
    ModelMerge = FALSE
    ModelLazy = TRUE
    MaxEvals = 2
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    SharedSections = "atomic"
    ModelPartDelegation = FALSE
    ModelPersistence = TRUE
    ImportInit = TRUE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = TRUE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
    ModelOffers <- OffersOn
    AcquireRunningGuard <- GuardOff
    TryAcquireGuard <- GuardOff
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection LazyMutualExclusion LazySuccessPermanent NoStaleCancelError EvalDoneComplete LazyCompleteSettled ReturnedLive OnePartWriter
PROPERTY ManagedOnlyWithSource
