\* Mutation of part_sources_merge: acquisition closes again after an address arrived -
\* the gate forgets it is managed (ManagedStickyGuard off), so once the
\* installed part's offer retired, a native body runs the part again. It
\* checks the consequence only: ManagedSticky would just restate the guard.
\* Expected: violates OnePartWriter.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 1
    MaxResults = 2
    Handles = {}
    AllowRelease = FALSE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = TRUE
    AllowPruneCut = FALSE
    AllowExpire = FALSE
    ModelMerge = TRUE
    ModelLazy = TRUE
    MaxEvals = 2
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    SharedSections = "atomic"
    ModelPartDelegation = FALSE
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = TRUE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
    ModelOffers <- OffersOn
    ManagedStickyGuard <- GuardOff
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection LazyMutualExclusion LazySuccessPermanent NoStaleCancelError EvalDoneComplete LazyCompleteSettled ReturnedLive OnePartWriter
PROPERTY ManagedOnlyWithSource NativeRunStaysNative
