\* Mutation, on the full declined-persistence scope (two sessions, one call,
\* release and expiry, no attachment failure, any call may decline): a call
\* that adopts a value another call declined persists it at its final
\* handoff, as publication would without reading the adopted entry's mark
\* (initCompletedResult's resDeclined). Expected: violate
\* DeclinedNeverPersisted.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1, s2}
    s1 = s1
    s2 = s2
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    Handles = {}
    AllowRelease = TRUE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    AllowExpire = TRUE
    ModelMerge = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    ModelPartDelegation = FALSE
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
    PersistDeclineChoices <- BothDeclineChoices
    AdoptHandoffGuard <- GuardOff
SYMMETRY Symm
INVARIANTS DeclinedNeverPersisted
