\* Declined persistence at expired entries. Scenario (CONSTRAINT
\* ExpiryDeclineScenario): only the second ongoing call's fn may decline,
\* so its value meets an entry the first call published - live (adopted),
\* expired with a retention edge (retired instead of replaced: the value
\* registers beside it), or expired without one (replaced in place, the
\* mark carried) - and its publication gives it no retention edge. Left
\* out: a first call that declines (persist_decline_live covers it while
\* values are live; no configuration covers that declined entry expiring and
\* being replaced or retired by a non-declining call), and, with two
\* invocations, a hit after the replacement. recipe_expiry's
\* scenario otherwise (two sessions, one call, release and expiry), without
\* attachment failure. A first call that declines is persist_decline_live's.
\* Expected: pass.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1, s2}
    s1 = s1
    s2 = s2
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    Handles = {}
    AllowRelease = TRUE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    AllowExpire = TRUE
    ModelMerge = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    ModelPartDelegation = FALSE
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
    PersistDeclineChoices <- BothDeclineChoices
SYMMETRY Symm
CONSTRAINT ExpiryDeclineScenario
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection OneLiveEntryPerCall NoPersistedAttachErroredResult NoErroredLookupSelection ReturnedLive ReturnedOwned NoHalfAttachedRead PersistableIntentDurable SharedLeaseReleasedWhenRetired RefusedOnlyAfterRelease DeclinedNeverPersisted
PROPERTY NoReplaceUnderUser
