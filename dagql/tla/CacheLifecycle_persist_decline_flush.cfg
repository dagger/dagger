\* Mutation of persist_decline_restart, in the same scenario (CONSTRAINT
\* RestartDeclineScenario): Flush drops the decline mark, as saving
\* without the envelope's PersistDeclined would. The declined cA value comes
\* back unmarked as cB's dependency, and the persistable cA hit after the
\* restart persists it, while its declinedTruth, which Flush saves
\* regardless, says it was declined. Expected: violate
\* DeclinedNeverPersisted.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA, cB}
    cA = cA
    cB = cB
    ClassOf <- DistinctClasses
    MaxInvocations = 3
    InvocationLimit <- TwoCallsBeforeRestart
    MaxResults = 2
    Handles = {}
    AllowRelease = TRUE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = TRUE
    AllowPruneCut = FALSE
    AllowExpire = FALSE
    ModelMerge = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    ModelPartDelegation = FALSE
    ModelPersistence = TRUE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
    PersistDeclineChoices <- BothDeclineChoices
    FlushKeepsDecline <- GuardOff
CONSTRAINT RestartDeclineScenario
INVARIANTS DeclinedNeverPersisted
