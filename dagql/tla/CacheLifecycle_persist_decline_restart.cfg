\* Declined persistence across a restart. Scenario (CONSTRAINT
\* RestartDeclineScenario): cA, then cB, then after the restart cA again;
\* cB and the second cA are persistable, and only cA's fn may decline. So a
\* declined cA value, kept only as the dependency of cB's persisted value,
\* is saved with its mark by Flush and restored by Restart, and a
\* persistable hit on it afterwards leaves it unpersisted (dagql's
\* TestCacheDeclinedValueStaysUnpersistedAcrossRestart). No session releases
\* before cB is spawned, so cB has published before Flush. Left out: other
\* call orders, an unpersistable cB or second cA, a declining cB, and a
\* release or restart before cB. cA and cB are in distinct classes; two
\* calls before the restart and one after; drained release. Expected: pass.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA, cB}
    cA = cA
    cB = cB
    ClassOf <- DistinctClasses
    MaxInvocations = 3
    InvocationLimit <- TwoCallsBeforeRestart
    MaxResults = 2
    Handles = {}
    AllowRelease = TRUE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = TRUE
    AllowPruneCut = FALSE
    AllowExpire = FALSE
    ModelMerge = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    ModelPartDelegation = FALSE
    ModelPersistence = TRUE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
    PersistDeclineChoices <- BothDeclineChoices
CONSTRAINT RestartDeclineScenario
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection FlushReferentialIntegrity NoDirtySnapshotResultServed ReturnedLive PersistableIntentDurable DeclinedNeverPersisted
