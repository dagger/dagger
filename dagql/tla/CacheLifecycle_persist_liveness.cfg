\* MaxResults must leave room for fresh publications on top of imported
\* results (imports can occupy up to 2 slots); too small a budget blocks
\* PubIndexFresh forever and reports a wedge that is purely the bound.
SPECIFICATION LiveSpec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 4
    AllowRelease = FALSE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    FixCanonicalHoldEarly = TRUE
    GuardResurrection = TRUE
    FixOnceErrGap = TRUE
    FixLostCancel = TRUE
    FixJoinerPersistable = TRUE
    ModelAttachBarrier = TRUE
    FnCanFail = FALSE
    LeaseCanFail = FALSE
    ModelLazy = FALSE
    ModelLazySingleflight = TRUE
    LazyCanFail = FALSE
    MaxEvals = 0
    AttachCanFail = FALSE
    ModelPersistence = TRUE
    ImportInit = TRUE
    DecodeCanFail = TRUE
PROPERTY EventuallyTerminal
