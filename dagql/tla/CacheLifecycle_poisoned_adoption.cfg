\* A persistable call whose fn returns a clean already-attached result must
\* not adopt an open-attachment sibling in the same class: adoption skips the
\* attach barrier and the handoff commits the persisted edge, so an open
\* sibling that later fails attachment would end up registered, persisted,
\* and errored. Needs two calls in one class plus a third invocation: one
\* publishes the open sibling, one publishes the clean result the fn
\* returns, and the persistable third adopts. Expected: pass.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA, cB}
    cA = cA
    cB = cB
    ClassOf <- OneClass
    MaxInvocations = 3
    MaxResults = 2
    AllowRelease = FALSE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    FnCanFail = FALSE
    AttachCanFail = TRUE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
SYMMETRY Symm
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection NoRetainedPoisonedEntry NoErroredLookupSelection
