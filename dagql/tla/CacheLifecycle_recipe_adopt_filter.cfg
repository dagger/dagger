\* D1 adoption keeps the session filter. The run starts from a restored
\* current entry whose stored requirements include a session-resource
\* handle (RequirementImportRows). A session that binds the handle adopts
\* the entry when it publishes the same call; one that does not registers
\* its own value beside it, live but not indexed, so the recipe index still
\* names one current entry. A clean shutdown saves whether each entry was
\* indexed, and the restart restores exactly that: OneLiveEntryPerCall holds
\* across it. Expected: pass.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    InvocationLimit <- OneCallBeforeRestart
    ImportRowChoices <- RequirementImportRows
    MaxResults = 2
    Handles = {h1}
    h1 = h1
    AllowRelease = TRUE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = TRUE
    AllowPruneCut = FALSE
    AllowExpire = FALSE
    ModelMerge = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    ModelPartDelegation = FALSE
    ModelPersistence = TRUE
    ImportInit = TRUE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection OneLiveEntryPerCall RequiredExact ReturnedResourcesBound ReturnedHitSatisfied ReturnedLive ReturnedOwned NoHalfAttachedRead FlushReferentialIntegrity NoDirtySnapshotResultServed
