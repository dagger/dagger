\* Expiry with a dependent (D9, as refined for the implementation). The run
\* starts from restored graphs: an entry retained by a persisted edge may
\* depend on another call's entry, whose value may already have expired,
\* either still an encoded envelope or decoded. When a new value of the
\* dependency's call arrives, the dependent's edge counts as a use, decoded
\* or not: the expired entry is retired and keeps serving the dependent,
\* and the new value registers as the call's current entry. The
\* replacement count never moves under a user (NoReplaceUnderUser). A
\* prune may cut the dependent's retention, which collects a retired entry
\* while the current one stays; PersistableIntentDurable is not checked,
\* because a prune may legitimately cut an edge it describes. Expected: pass.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA, cB}
    cA = cA
    cB = cB
    ClassOf <- DistinctClasses
    MaxInvocations = 1
    MaxResults = 3
    Handles = {}
    AllowRelease = FALSE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = TRUE
    AllowExpire = TRUE
    ModelMerge = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    SharedSections = "atomic"
    ModelPartDelegation = FALSE
    ModelPersistence = TRUE
    ImportInit = TRUE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = TRUE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
SYMMETRY Symm
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection OneLiveEntryPerCall NoPersistedAttachErroredResult ReturnedLive ReturnedOwned NoHalfAttachedRead DecodeMutualExclusion
PROPERTY NoReplaceUnderUser
