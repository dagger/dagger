\* Retirement across a restart (D9). The run starts from a restored graph
\* in which a retained entry depends on another call's entry
\* (DependentImportRows). Before the restart that dependency expires and a
\* new value of its call retires it, because the dependent uses it, and
\* registers as the call's current entry; the current entry may itself
\* expire. A clean shutdown saves both, and the restart restores the index
\* state, the expiry and the replacement count with each row: the recipe
\* index names the current entry only, expired or not. The run is bounded to
\* one publication, before the restart; publication after a restart is
\* covered by the Go restart tests (see the README).
\* Expected: pass.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA, cB}
    cA = cA
    cB = cB
    ClassOf <- DistinctClasses
    MaxInvocations = 1
    InvocationLimit <- OneCallBeforeRestart
    ImportRowChoices <- DependentImportRows
    MaxResults = 3
    Handles = {}
    AllowRelease = TRUE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = TRUE
    AllowPruneCut = FALSE
    AllowExpire = TRUE
    ModelMerge = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    ModelPartDelegation = FALSE
    ModelPersistence = TRUE
    ImportInit = TRUE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
SYMMETRY SymmCalls
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection OneLiveEntryPerCall NoPersistedAttachErroredResult FlushReferentialIntegrity NoDirtySnapshotResultServed ReturnedLive ReturnedOwned NoHalfAttachedRead
PROPERTY NoReplaceUnderUser
