\* Call records: a merge teaches a call's identity onto the entry it
\* returned (teachCallIdentityLocked), so the other call's lookups hit that
\* entry. Equivalence is the static ClassOf here, so both calls share one
\* class: cB's lookups may select cA's merged entries, or miss. This checks
\* the lifecycle of that cross-call lookup candidate, not that teaching is
\* correct or when it may happen: no action teaches. Teaching adds no
\* entry, owner, dependency or recipe-index key, so it is otherwise this
\* merge. The lookup hit runs as separate selection and claim steps
\* (SharedSections = "split") inside one read section: merges, which hold
\* egraphMu for writing, wait until it closes, while release marking
\* interleaves. Otherwise recipe_merge: publication, release, expiry and a
\* failed attachment. Expected: pass.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA, cB}
    cA = cA
    cB = cB
    ClassOf <- OneClass
    MaxInvocations = 1
    MaxResults = 3
    Handles = {}
    AllowRelease = TRUE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = TRUE
    AllowPruneCut = FALSE
    AllowExpire = TRUE
    ModelMerge = TRUE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    SharedSections = "split"
    ModelPartDelegation = FALSE
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = TRUE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
SYMMETRY SymmCalls
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection OneLiveEntryPerCall NoPersistedAttachErroredResult NoErroredLookupSelection ReturnedLive ReturnedOwned NoHalfAttachedRead SharedLeaseReleasedWhenRetired
PROPERTY NoReplaceUnderUser
