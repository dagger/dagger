\* Session release while the session's own call is between claiming its
\* edge and returning: the release consumes the claim and collects the
\* result, and the caller is handed a result whose release hooks already
\* ran. Expected: ReturnedLive violated. The drain_escape config shows the
\* same outcome with the server's drain honored.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 1
    AllowRelease = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS ReturnedLive
