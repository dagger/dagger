\* Session release and persisted-edge pruning firing freely during in-flight
\* calls, including executor-nested ones: the graph-integrity core.
\* Expected: pass. NoUnderflow is deliberately not checked: the release
\* decrement is keyed on the record snapshot and can consume an in-flight
\* claim's unit, driving a count negative (see the release_steal config).
\* Ownership accounting stays exact because that theft is booked in the
\* stolen ghost counter.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1, s2}
    s1 = s1
    s2 = s2
    Calls = {cA, cB}
    cA = cA
    cB = cB
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    AllowRelease = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = TRUE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = TRUE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
SYMMETRY Symm
INVARIANTS TypeOK OwnershipExact NoResurrection
