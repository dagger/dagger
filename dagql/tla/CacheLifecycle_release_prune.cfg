\* Session release and persisted-edge pruning firing freely during in-flight
\* calls, including executor-nested ones: the graph-integrity core.
\* Expected: pass, including exact ownership, no underflow, no orphaned
\* session units at quiescence, and sound released-session refusals.
\* Session-resource gating runs here too (Handles = {h1}): bind, the
\* lookup filter, and the required-set recomputes interleave with release
\* and prune; RequiredExact and ReturnedGated gate them.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1, s2}
    s1 = s1
    s2 = s2
    Calls = {cA, cB}
    cA = cA
    cB = cB
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    Handles = {h1}
    h1 = h1
    AllowRelease = TRUE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = TRUE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = TRUE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
SYMMETRY Symm
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection NoOrphanEdgesAtQuiescence RefusedOnlyAfterRelease ReturnedLive RequiredExact ReturnedGated
