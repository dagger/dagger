\* Session release and persisted-edge pruning firing freely during in-flight
\* calls, including executor-nested ones: the graph-integrity core.
\* Expected: pass, including exact ownership, no underflow, no orphaned
\* session units at quiescence, and sound released-session refusals.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1, s2}
    s1 = s1
    s2 = s2
    Calls = {cA, cB}
    cA = cA
    cB = cB
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    AllowRelease = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = TRUE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = TRUE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
SYMMETRY Symm
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection NoOrphanEdgesAtQuiescence RefusedOnlyAfterRelease
