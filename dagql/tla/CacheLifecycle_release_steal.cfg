\* The release decrement is keyed on the record snapshot (cache.go:785-798),
\* not on landed increments. A record whose increment is still pending gets
\* decremented anyway, consuming the publication handoff hold's unit: the
\* result is collected under an active hold, and the hold's own release
\* drives the count to -1 (the runtime error at cache.go:972-974).
\* Expected: NoUnderflow violated.
SPECIFICATION Spec
