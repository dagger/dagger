\* ReleaseSession may return while an admitted operation still owns deferred
\* cleanup. A subsequent WaitSessionRelease returns only after that operation
\* exits and cleanup deletes the session records. Expected: pass.
SPECIFICATION LiveSpec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 1
    MaxResults = 1
    AllowRelease = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS TypeOK ReleaseWaitSafe ReturnedLive OwnershipExact
PROPERTIES DeferredReleaseEventuallyCompletes ReleaseWaitEventuallyReturns
