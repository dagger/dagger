\* Session-resource gating with no persistence: two sessions, two calls in
\* one equivalence class, one handle h1. Exercises bind before publish, an
\* unbound session missing and executing its own, bind-then-hit, bind racing
\* release, publication adoption respecting the publishing session's bound
\* set, and attachment of a gated leaf reaching the parent's stored required
\* set. The two gating properties hold here: RequiredExact (the stored
\* set equals the transitive recount) and ReturnedGated (no session is handed
\* a result depending on a handle leaf it never bound). Expected: pass.
\*
\* This configuration subsumes the former core configuration: same
\* sessions, calls, and bounds, every core invariant, and strictly more
\* behavior - every no-release, no-bind path core explored exists here
\* unchanged - so core was deleted. NoSpuriousErrors does NOT run here:
\* with release enabled it is red on current code - the pinned
\* attach_release_reader finding (a publisher's release failing a parked
\* cross-session reader) is reachable at these bounds - so that property
\* lives in decode_cancel (no release) and in the pinned red
\* configuration until the ruling.
\*
\* SYMMETRY Symm is sound here: the spec never names a session or a call, h1
\* is outside Symm, every listed invariant is symmetric, and this is a safety
\* configuration, like release_prune and poisoned_adoption. Symmetric
\* count under the admitted/claimed inner-load and attachment-attempt
\* model: 12,352,815 distinct states.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1, s2}
    s1 = s1
    s2 = s2
    Calls = {cA, cB}
    cA = cA
    cB = cB
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    Handles = {h1}
    h1 = h1
    AllowRelease = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
SYMMETRY Symm
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection NoOrphanEdgesAtQuiescence RefusedOnlyAfterRelease PersistableIntentDurable ReturnedLive ReturnedOwned NoHalfAttachedRead RequiredExact ReturnedGated
