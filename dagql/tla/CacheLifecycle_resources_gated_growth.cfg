\* ACCEPTED FINDING: ReturnedGated is expected to be violated on current
\* code by requirement growth after the lookup filter has run.
\*
\* The lookup filter judges a candidate's STORED requiredSessionResources
\* at selection time, and nothing re-checks between then and the serve.
\* Two writers can grow the set in that window, and the stored accounting
\* itself stays exact throughout (RequiredExact holds - see
\* resources_latedep):
\*   1. Attachment. A session hits a still-attaching result while its
\*      stored set is {}, waits at the read barrier, and the publisher's
\*      attachment then adds a handle leaf as an explicit dep
\*      (attachDependencyResults -> AddExplicitDependency) before closing
\*      the barrier. The waiter is served a result that now transitively
\*      requires a handle its session never bound. 22-state trace: s1
\*      binds h1 and publishes the leaf; s1's second call publishes r2 and
\*      begins attaching; s2 hits r2 (stored {} passes), parks at the
\*      barrier; PubAttachAddDep adds r2 -> leaf; the barrier closes; s2
\*      exits done with retGated FALSE. This trace needs no late deps
\*      (red with ModelLateDeps = FALSE) and no exotic caller.
\*   2. Late explicit dependencies (AddDepLate, ModelLateDeps = TRUE
\*      here): the same window, opened after publication instead of
\*      during it, by AddExplicitDependency on an already-published
\*      result.
\* Three invocations are required, which is why resources (MaxInvocations
\* 2) stays green: its bound masks this race, not the code. Whether to
\* fix (re-check the filter after the barrier, or forbid
\* requirement-extending growth after indexing) or to scope the contract
\* to filter-at-selection is Erik's ruling; the red stays pinned either
\* way.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1, s2}
    s1 = s1
    s2 = s2
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 3
    MaxResults = 3
    Handles = {h1}
    h1 = h1
    AllowRelease = FALSE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = TRUE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
SYMMETRY Symm
INVARIANTS ReturnedGated
