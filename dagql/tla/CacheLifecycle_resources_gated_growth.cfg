\* Requirement growth after the lookup filter: two sessions, one call,
\* MaxInvocations 3 (leaf publication, parent publication, and the second
\* session's hit). Expected: pass.
\*
\* The lookup filter judges a candidate's STORED requiredSessionResources
\* at selection time. Attachment can grow that set afterwards: a session
\* hits a still-attaching result while its stored set is {}, parks at the
\* read barrier, and the publisher's attachment adds a handle leaf as an
\* explicit dep before closing the barrier. This configuration held that
\* as an accepted red until the code fixes landed with it, and now gates
\* both closures:
\*   1. The serve re-runs the filter after the attach barrier
\*      (sessionStillSatisfiesResourceRequirements): a stale hit becomes
\*      a miss (ReadBarrierGatedMiss) and a gated result-ID load refuses.
\*   2. The late window is closed at the source: AddExplicitDependency
\*      refuses requirement-carrying deps (AddDepLate's empty-required
\*      guard; ModelLateDeps stays TRUE here so the refusal is in play),
\*      so a settled result's stored set is frozen.
\* MaxResults 2 suffices: the pre-fix violation trace used only the leaf
\* and the parent. Re-break evidence: dropping the ReadBarrierOk re-check
\* conjunct or AddDepLate's empty-required guard turns this red again.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1, s2}
    s1 = s1
    s2 = s2
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 3
    MaxResults = 2
    Handles = {h1}
    h1 = h1
    AllowRelease = FALSE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = TRUE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
SYMMETRY Symm
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection ReturnedLive ReturnedOwned NoHalfAttachedRead RequiredExact ReturnedGated
