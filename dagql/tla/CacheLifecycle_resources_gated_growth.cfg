\* Requirement growth after the lookup filter, attachment window: two
\* sessions, one call, MaxInvocations 3 (leaf publication, parent
\* publication, and the second session's hit). Expected: pass.
\*
\* The lookup filter judges a candidate's STORED requiredSessionResources
\* at selection time. Attachment can grow that set afterwards: a session
\* hits a still-attaching result while its stored set is {}, parks at the
\* read barrier, and the publisher's attachment adds a handle leaf as an
\* explicit dep before the barrier opens. The serve re-validates by the
\* requirement generation captured at selection (the ReadBarrierOk
\* disjunct over selRequired): the stale hit becomes a miss
\* (ReadBarrierGatedMiss) and a requirement-checked result-ID load
\* refuses. ReturnedHitSatisfied holds every completed hit serve to the
\* conservative stored set, and ReturnedGated to the data closure - the
\* attach-window growth is a data dep, so both judge it.
\*
\* ModelLateDeps stays FALSE for state-space budget: the other source of
\* post-selection growth, the requirement-carrying retention edge, has
\* its own configurations at bounds where its window and its ancestor
\* cascade are reachable (resources_latedep_recheck and
\* resources_latedep_cascade; plain accounting in resources_latedep).
\* MaxResults 2 suffices here: the pre-fix violation trace used only the
\* leaf and the parent. Re-break evidence: dropping the ReadBarrierOk
\* hit-path re-validation disjunct turns this red on ReturnedGated (the
\* attach-window data growth is served stale).
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1, s2}
    s1 = s1
    s2 = s2
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 3
    MaxResults = 2
    Handles = {h1}
    h1 = h1
    AllowRelease = FALSE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
SYMMETRY Symm
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection ReturnedLive ReturnedOwned NoHalfAttachedRead RequiredExact ReturnedGated ReturnedHitSatisfied
