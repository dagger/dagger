\* Late explicit retention edges and session-resource accounting: one
\* session, one call, MaxResults 3 so a dependency chain can sit above the
\* new edge. Expected: pass.
\*
\* AddDepLate models Cache.AddExplicitDependency on an already-published
\* result (core/sdk/module_typedefs.go retains an SDK-generated typedefs
\* module under the published container). The entry point accepts deps
\* that carry session-resource requirements - a module loaded over
\* private git via SSH reaches the ssh-agent socket handle - and the same
\* critical section cascades the grown stored set to the parent and its
\* ancestors; RequiredExact holds that accounting exact, and
\* ReturnedResourcesBound (the data-closure judgment) and ReturnedHitSatisfied
\* (the conservative stored-set judgment on hit serves) hold here. At one
\* session every publisher binds whatever it publishes, so the value of
\* this configuration is cheap accounting coverage; the serve-time
\* re-validation of a stale selection and the ancestor cascade are
\* exercised at reachable bounds by resources_latedep_recheck and
\* resources_latedep_cascade (an imported graph supplies the parent or
\* the ancestor chain there, instead of extra publications).
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 3
    MaxResults = 3
