\* Late explicit retention edges and session-resource accounting: one
\* session, one call, MaxResults 3 so a dependency chain can sit above the
\* new edge. Expected: pass.
\*
\* AddDepLate models Cache.AddExplicitDependency on an already-published
\* result (core/sdk/module_typedefs.go retains an SDK-generated typedefs
\* module under the published container). The entry point refuses a dep
\* whose stored required set is non-empty, so a settled result's set is
\* frozen and no ancestor can go stale; RequiredExact gates that freeze
\* (dropping the guard lets a requirement-carrying edge land with the
\* stored set left behind the transitive recount, and this configuration
\* goes red, the guard's re-break). ReturnedGated holds too; the
\* two-session attach-window growth has its own gate in
\* resources_gated_growth.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 3
    MaxResults = 3
    Handles = {h1}
    h1 = h1
    AllowRelease = FALSE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = TRUE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection ReturnedLive ReturnedOwned NoHalfAttachedRead RequiredExact ReturnedGated
