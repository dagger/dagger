\* Late explicit dependencies and session-resource accounting: one session,
\* one call, MaxResults 3 so a dependency chain can sit above the new edge.
\* Expected: pass.
\*
\* AddDepLate models Cache.AddExplicitDependency on an already-published
\* result (core/sdk/module_typedefs.go attaches generated module types to
\* the published module container). addExplicitDependencyLocked recomputes
\* the parent's STORED requiredSessionResources and cascades the change
\* upward through depParents (the worklist in cache.go), so an ancestor
\* that already depends on the parent learns about requirements the new
\* dep introduces. RequiredExact gates that cascade: with the recompute
\* restricted to the parent alone, an ancestor's stored set goes stale and
\* this configuration goes red.
\*
\* ReturnedGated is deliberately NOT listed here: a late dependency can
\* extend a result's transitive requirement while another session's
\* invocation already holds it, and nothing in the code re-validates at
\* return, so ReturnedGated is violated on current code. That accepted
\* finding is pinned by resources_latedep_gated (two sessions; TLC stops
\* at its violation, which would mask the gate this configuration holds).
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 3
    MaxResults = 3
    Handles = {h1}
    h1 = h1
    AllowRelease = FALSE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = TRUE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection ReturnedLive ReturnedOwned NoHalfAttachedRead RequiredExact
