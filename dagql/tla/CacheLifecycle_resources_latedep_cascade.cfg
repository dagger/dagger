\* The late retention edge's ancestor cascade, at bounds where an
\* ancestor is reachable: one session, one call, an imported two-row
\* dependency chain above the new edge. Expected: pass.
\*
\* An imported ancestor->parent chain starts with empty stored required
\* sets; the session binds the handle, publishes a handle leaf, holds
\* parent and leaf through its running fn's inner loads, and lands the
\* requirement-carrying retention edge (AddDepLate). The cascade must
\* grow the parent's AND the imported ancestor's stored sets to the
\* transitive requirement; RequiredExact gates that in every state. An
\* imported chain is what keeps the ancestor inside two invocations: at
\* these machinery bounds a published ancestor would need a third
\* publication before the actor runs. Re-break evidence: restricting
\* AddDepLate's cascade to the parent alone turns this red on
\* RequiredExact through the imported ancestor.
