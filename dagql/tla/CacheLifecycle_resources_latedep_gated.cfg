\* ACCEPTED FINDING: ReturnedGated is expected to be violated on current
\* code by a late explicit dependency.
\*
\* A session that never bound h1 obtains a result while its transitive
\* requirement is empty - the lookup filter passes it correctly. Before
\* that invocation returns, AddDepLate (Cache.AddExplicitDependency on the
\* already-published result, or on one of its dependencies) attaches a
\* handle leaf underneath it. The stored accounting follows exactly
\* (RequiredExact holds - see resources_latedep), but the invocation then
\* exits holding a result that NOW depends on a handle leaf its session
\* never bound: retGated is FALSE. Nothing in the code synchronizes late
\* dependency attachment with in-flight readers of the parent or its
\* ancestors, and nothing re-validates at the return boundary. 21-state
\* trace: three invocations spawn and publish, a session binds h1 and
\* publishes the leaf, AddDepLate attaches the other session's result to
\* the leaf, that session's invocation exits done with retGated FALSE.
\*
\* Whether this is a defect to fix (forbid requirement-extending late
\* deps, or re-validate at return) or a contract to scope (gating judged
\* at lookup time) is Erik's ruling; the configuration keeps the red
\* pinned either way. Two sessions are required: the harmed session must
\* be one that cannot bind the handle away.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1, s2}
    s1 = s1
    s2 = s2
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 3
    MaxResults = 3
    Handles = {h1}
    h1 = h1
    AllowRelease = FALSE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = TRUE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
SYMMETRY Symm
INVARIANTS ReturnedGated
