\* The late-dep stale-serve window, at bounds where it is reachable: two
\* sessions, one call, an imported starting graph. Expected: pass.
\*
\* The scenario mirrors production after an engine restart, and the
\* imported graph is what keeps it inside two invocations and two
\* results: a plain parent and a handle leaf are imported; session s1
\* binds the handle, holds both through its running fn's inner loads,
\* and lands the requirement-carrying retention edge (AddDepLate);
\* session s2, which never binds the handle, selects the parent BEFORE
\* the edge and reaches its serve AFTER it, and the serve-time
\* re-validation (the ReadBarrierOk disjunct over the selection capture
\* selRequired) converts that stale hit to a miss
\* (ReadBarrierGatedMiss). An imported parent also proves the
\* generation mechanism covers results with no attach barrier, which
\* the former barrier-based re-check skipped.
\*
\* ReturnedHitSatisfied gates the re-validation (every completed hit
\* serve satisfied the CURRENT stored set); ReturnedGated stays green
\* throughout because a retention edge does not extend any payload's
\* data closure. The ancestor cascade has its own configuration
\* (resources_latedep_cascade). Re-break evidence: dropping the
\* ReadBarrierOk hit-path re-validation disjunct makes a completed stale
\* late-edge serve reachable (red on ReturnedHitSatisfied) while every
\* such serve still satisfies the data closure (a late-edge-restricted
\* variant of ReturnedGated stays green over the complete weakened
\* space - the late edge is liveness-only, unlike the attach-window
\* data growth in resources_gated_growth).
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1, s2}
    s1 = s1
    s2 = s2
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    Handles = {h1}
    h1 = h1
    AllowRelease = FALSE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = TRUE
    ImportInit = TRUE
    ModelNestedCalls = FALSE
    ModelLateDeps = TRUE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
SYMMETRY Symm
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection ReturnedLive ReturnedOwned NoHalfAttachedRead RequiredExact ReturnedGated ReturnedHitSatisfied
