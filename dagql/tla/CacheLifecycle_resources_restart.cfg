\* Session-resource gating across import and restart. ACCEPTED FINDING:
\* RequiredExact is expected to be violated on current code.
\*
\* Defect: the STORED requiredSessionResources set drifts from the true
\* transitive requirement in two places the model reproduces, both defects
\* that also exist unchanged on upstream/main:
\*   1. Import order. importPersistedState recomputes each result's required
\*      set by unioning its dependencies' STORED sets one level deep, folding
\*      recomputeRequiredSessionResourcesLocked over c.resultsByID in Go map
\*      order (cache_persistence_import.go:359, recompute at cache.go:556). A
\*      parent visited before its dependency reads the dependency's not-yet-
\*      computed set and is never revisited, so it ends with an empty or
\*      partial required set. TLC finds this at an INITIAL state (FoldRequired
\*      over a nondeterministic order).
\*   2. Decode overwrite on a non-leaf. When a decoded value is installed,
\*      ensurePersistedHitValueLoaded copies required from the decoded value,
\*      which knows only its own handle (cache_persistence_import.go:679-685,
\*      via decodePersistedResultEnvelope.setHandle). A non-leaf result loses
\*      its dependency-derived requirement and is then servable to unbound
\*      sessions. In the model this is the eager-import overwrite for rows
\*      that start "decoded" (ImportRequiredFinal) and the read-barrier
\*      DecodeInstall for rows decoded during a run. TLC halts at the first
\*      violation (the import-order initial state), so the DecodeInstall red
\*      is demonstrated separately by probe; both share RequiredExact.
\*
\* One session suffices because RequiredExact is a state predicate over the
\* stored set versus the recount - it needs only one imported graph, no
\* second session to receive the drifted result. ReturnedGated (the harm:
\* an unbound session served a gated result) would need two sessions - one
\* holding the leaf, one unbound receiving the drifted non-leaf - and is not
\* checked here. Erik decides what to do with the code; the model keeps
\* reporting RequiredExact until the code maintains the stored set correctly.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    Handles = {h1}
    h1 = h1
    AllowRelease = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = TRUE
    ImportInit = TRUE
    ModelNestedCalls = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection ReturnedLive RequiredExact
