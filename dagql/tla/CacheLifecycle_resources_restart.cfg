\* Session-resource gating across import and restart. ACCEPTED FINDING:
\* RequiredExact is expected to be violated on current code.
\*
\* Defect: the STORED requiredSessionResources set drifts from the true
\* transitive requirement in two places the model reproduces, both defects
\* that also exist unchanged on upstream/main:
\*   1. Import order. importPersistedState recomputes each result's required
\*      set by unioning its dependencies' STORED sets one level deep, folding
\*      recomputeRequiredSessionResourcesLocked over c.resultsByID in Go map
\*      order (cache_persistence_import.go:359, recompute at cache.go:556). A
\*      parent visited before its dependency reads the dependency's not-yet-
\*      computed set and is never revisited, so it ends with an empty or
\*      partial required set. In the model: FoldRequired over a
\*      nondeterministic order, in an initial state and after Restart.
\*   2. Decode overwrite on a non-leaf. When a decoded value is installed,
\*      the cache copies required from the decoded value, which knows only
\*      its own handle (decodePersistedResultEnvelope.setHandle), so a
\*      non-leaf loses its dependency-derived requirement and is then
\*      servable to unbound sessions. Two sites: the eager decode at import
\*      (cache_persistence_import.go:419-428; the model's
\*      ImportRequiredFinal for rows that start "decoded") and the read
\*      barrier's install (:676-685; the model's DecodeInstall).
\* TLC halts at the first violation, an initial state whose parent row was
\* re-imported "decoded" with required {}: that is defect 2's eager-decode
\* site, which applies whatever the fold order. The two defects are isolated
\* by scratch invariants (ImportedEnvelopeRequiredExact, violated at depth 0
\* on an "envelope" row, where no eager decode is involved, so it is the
\* fold order; DecodeInstallRequiredExact, violated after DecodeInstall on a
\* non-leaf, the runtime overwrite); both share RequiredExact here.
\*
\* One session suffices. RequiredExact is a state predicate over the stored
\* set versus the recount, so it needs only one imported graph. ReturnedGated
\* (the harm: an unbound session served a gated result) is ALSO violated
\* here with one session, because the drifted stored set {} lets a session
\* that never bound h1 hit the non-leaf (a five-state probe trace: Spawn,
\* LookupHit on the re-imported non-leaf, ReadBarrierOk, operation exit as
\* "done" with retGated FALSE). It is not listed in INVARIANTS because TLC
\* stops at the first violation and RequiredExact trips at depth 0; the
\* expected red is RequiredExact. The two-session shape (one session holding
\* the leaf, another unbound receiving the drifted non-leaf) is needed only
\* when the drift is produced by a decode during the run rather than by
\* import. Erik decides what to do with the code; the model keeps reporting
\* RequiredExact until the code maintains the stored set correctly.
