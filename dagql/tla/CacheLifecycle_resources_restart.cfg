\* Session-resource gating across import and restart: one session, one
\* call, persistence and import-derived initial states on, restart
\* reachable. Expected: pass.
\*
\* This configuration held two accepted findings until the code fixes
\* landed with it, and now gates both:
\*   1. Import order. importPersistedState used to recompute each row's
\*      STORED requiredSessionResources by folding over c.resultsByID in Go
\*      map order, so a parent visited before its dependency kept an empty
\*      set. The recompute now walks dependencies first (memoized DFS), and
\*      the model's ImportRequiredFinal mirrors that: every imported row
\*      starts with its transitive requirement.
\*   2. Decode overwrite. Both decode installs (the eager import decode and
\*      the hit path in ensurePersistedHitValueLoaded) used to copy
\*      requiredSessionResources from the decoded shell, which knows only
\*      the row's own handle, wiping a non-leaf's dependency-derived set.
\*      The installs no longer touch the session-resource fields, and the
\*      model's DecodeInstall mirrors that.
\* RequiredExact gates the accounting (stored set = transitive recount) and
\* ReturnedGated gates the harm (no session is handed a result depending on
\* a handle leaf it never bound); with the drift gone, TLC no longer stops
\* at RequiredExact, so both run here in one configuration. One session
\* suffices: before the fixes, an unbound session could hit a drifted
\* non-leaf served straight out of import.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    Handles = {h1}
    h1 = h1
    AllowRelease = TRUE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = TRUE
    ImportInit = TRUE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection ReturnedLive RequiredExact ReturnedGated
