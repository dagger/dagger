\* The resources_restart scenario checked for the harm itself: ReturnedGated
\* only. ACCEPTED FINDING. Expected: ReturnedGated is violated.
\*
\* resources_restart tracks the accounting (RequiredExact: the STORED
\* requiredSessionResources set drifts from the true transitive requirement
\* at import and at decode; its header names the two defects and the Go
\* anchors). This configuration tracks what that drift does to a caller. A
\* session that never bound h1 looks up the re-imported non-leaf, whose
\* stored set is {} although it depends on the h1 leaf. The filter
\* (selectLookupCandidateForSessionLocked via
\* sessionSatisfiesResourceRequirementsLocked, cache_egraph.go:671) passes
\* it, because an empty required set satisfies every session, and the
\* session is handed a result that depends on a handle leaf it never bound.
\* Shortest trace, five states: Spawn; LookupHit on the non-leaf;
\* ReadBarrierOk; operation exit as "done" with retGated FALSE.
\*
\* One session suffices because the drift comes from import (either defect).
\* A drift produced by a decode during the run would need a second session
\* holding the leaf. RequiredExact is deliberately not listed: it trips at
\* depth 0 and would stop TLC before this violation is reached. Erik decides
\* what to do with the code; the model keeps reporting ReturnedGated until
\* the stored set is maintained correctly.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    Handles = {h1}
    h1 = h1
    AllowRelease = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = TRUE
    ImportInit = TRUE
    ModelNestedCalls = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS ReturnedGated
