\* The hit-path error rollback (cache_egraph.go:1002-1022; second copy in
\* lookupCacheForDigests) deletes the session-map record unconditionally
\* but decrements only when this call created the edge. A failing repeat
\* hit - via attach failure or reader cancellation - strips the record for
\* an increment that stays counted. Expected: OwnershipExact violated.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 3
    MaxResults = 2
    AllowRelease = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    FnCanFail = FALSE
    AttachCanFail = TRUE
    LeaseCanFail = FALSE
    ReaderCanCancel = TRUE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
INVARIANTS OwnershipExact
