\* The same rollback asymmetry through its widest door, persisted-decode
\* failure: the edge creator decodes successfully and returns; a later
\* same-session hit fails a fresh decode attempt and strips the creator's
\* record; the creator's increment is orphaned permanently.
\* Expected: OwnershipExact violated.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 2
    MaxResults = 2
    AllowRelease = FALSE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    ModelPersistence = TRUE
    ImportInit = TRUE
    ModelNestedCalls = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = TRUE
INVARIANTS OwnershipExact
