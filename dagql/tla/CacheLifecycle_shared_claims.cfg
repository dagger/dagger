\* The egraphMu read sections overlapping. The lookup hit runs as separate
\* selection and claim steps (SharedSections = "split"): another
\* session's hit, release marking and its sessionMu snapshot and every
\* lock-free step interleave between them, while write-locked steps wait
\* for the claim. Two sessions and three invocations let two sessions' hits
\* and a release overlap on one result. Bounds: prune, persistable requests
\* and executor-nested calls off. shared_claims_prune adds prune and
\* persistable requests; the ID-load claim's split runs in
\* shared_claims_resources (an imported graph). With nested calls on, this
\* configuration did not finish in about an hour at four TLC workers.
\* Expected: pass.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1, s2}
    s1 = s1
    s2 = s2
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 3
    MaxResults = 1
    Handles = {}
    AllowRelease = TRUE
    ReleaseSessions <- AllSessions
    PersistableIntent = FALSE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    AllowExpire = FALSE
    ModelMerge = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    SharedSections = "split"
    ModelPartDelegation = FALSE
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
