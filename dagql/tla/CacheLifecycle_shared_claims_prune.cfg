\* shared_claims with prune and persistable requests on and executor-nested
\* calls off (SharedSections = "split"): two sessions' overlapping lookup
\* hits, release marking and its sessionMu snapshot interleave between
\* selection and claim, while prune, the persisted-edge commit of a
\* persistable hit and every other write-locked step wait for the claim.
\* The ID-load claim's split is covered by shared_claims and
\* shared_claims_resources. Only s1 may release (call-only symmetry, since
\* the sessions are no longer interchangeable): with both sessions
\* releasing it had not finished after 100 minutes at ten workers (270
\* million distinct states, the queue still growing); as is, it passes with
\* about 309 million. Three invocations keep two lookup hits reachable, so
\* s1's release marking and snapshot can interleave with s2's open read
\* section, while cleanup and prune wait until every read section has
\* closed. s2's release interleavings with prune are not
\* explored here; shared_claims covers both sessions releasing, without
\* prune. shared_claims_prune_stale_edge is its mutation at these bounds.
\* Expected: pass.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1, s2}
    s1 = s1
    s2 = s2
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 3
    MaxResults = 1
    Handles = {}
    AllowRelease = TRUE
    ReleaseSessions = {s1}
    PersistableIntent = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = TRUE
    AllowExpire = FALSE
    ModelMerge = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    SharedSections = "split"
    ModelPartDelegation = FALSE
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection NoOrphanEdgesAtQuiescence RefusedOnlyAfterRelease ReturnedLive ReturnedOwned NoHalfAttachedRead SharedLeaseReleasedWhenRetired
SYMMETRY SymmCalls
