\* Mutation of shared_claims_prune, as shared_claims_stale_edge is of
\* shared_claims: the claim step trusts the session edge it read at
\* selection (SharedSections = "split_stale_edge"). The bounds are exactly
\* shared_claims_prune's; its counterexample has two lookup hits selected
\* and unclaimed at once, so those bounds let two hits overlap. Expected:
\* violates OwnershipExact.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1, s2}
    s1 = s1
    s2 = s2
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 3
    MaxResults = 1
    Handles = {}
    AllowRelease = TRUE
    ReleaseSessions = {s1}
    PersistableIntent = TRUE
    DrainOnRelease = FALSE
    AllowPruneCut = TRUE
    AllowExpire = FALSE
    ModelMerge = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    SharedSections = "split_stale_edge"
    ModelPartDelegation = FALSE
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection NoOrphanEdgesAtQuiescence RefusedOnlyAfterRelease ReturnedLive ReturnedOwned NoHalfAttachedRead SharedLeaseReleasedWhenRetired
SYMMETRY SymmCalls
