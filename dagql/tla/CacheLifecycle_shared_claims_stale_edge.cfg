\* Mutation of shared_claims: the claim step trusts the session edge it
\* read at selection instead of re-reading it under sessionMu
\* (SharedSections = "split_stale_edge"). Two overlapping hits of one
\* session that both selected before either claimed both add an ownership
\* unit for one session edge. Expected: violates OwnershipExact, proving the
\* split configuration can observe overlapping read sections.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1, s2}
    s1 = s1
    s2 = s2
    Calls = {cA}
    cA = cA
    ClassOf <- OneClass
    MaxInvocations = 3
    MaxResults = 1
    Handles = {}
    AllowRelease = TRUE
    ReleaseSessions <- AllSessions
    PersistableIntent = FALSE
    DrainOnRelease = FALSE
    AllowPruneCut = FALSE
    AllowExpire = FALSE
    ModelMerge = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    SharedSections = "split_stale_edge"
    ModelPartDelegation = FALSE
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = TRUE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection NoOrphanEdgesAtQuiescence RefusedOnlyAfterRelease ReturnedLive ReturnedOwned NoHalfAttachedRead SharedLeaseReleasedWhenRetired
SYMMETRY Symm
