\* Deliberate fault: the checkpoint does not record that the receiver has its
\* retained operation, so after the restart a part that is still pending has
\* nothing to produce it.
\* Expected: OperationRetained violated.
CONSTANTS
    MaxSyncFailures = 2
    Fault = "DropOperationAtCheckpoint"
SPECIFICATION Spec
INVARIANTS TypeOK OperationRetained
