\* Deliberate fault: Commit expects a revision the receiver never has, so it
\* refuses with its counters unmoved. The progress rule must end the demand,
\* and on the second round.
\* Expected: NoProgressIsUnreachable violated.
CONSTANTS
    Tasks = {1, 2}
    MaxCancels = 1
    MaxOffers = 2
    MaxSyncFailures = 1
    DonorCanLeave = TRUE
    Fault = "WrongExpectation"
SPECIFICATION Spec
INVARIANTS TypeOK NoProgressIsUnreachable
