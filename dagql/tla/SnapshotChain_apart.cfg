\* Applying apart (overlayfs outside a user namespace): two importers apply
\* each missing layer into a parentless snapshot of its own, concurrently,
\* and commit them onto their parents in order. Imports of the same layers
\* hold each other off under the layer's chain-ID lock and reuse its commit.
\* A later layer may finish applying while an earlier one fails; the drain
\* then releases its snapshot and lock (CleanupComplete). Downloads are
\* shared and retried, and GC prunes throughout. Expected: pass.
\*
\* Reachability probes, injected with tla-check one; each must be violated:
\*   ProbeApartReleaseApplied == "apartReleaseApplied" \notin seen
\*   ProbeApartOutOfOrder == "apartOutOfOrder" \notin seen
\*   ProbeApartSkip == "apartSkip" \notin seen
\* The first: a failed import releases a later layer it applied. The second:
\* a layer finishes applying before an earlier one. The third: an import
\* waits on another's chain lock and then finds the layer imported.
CONSTANTS
    NumLayers = 2
    MaxStarts = 2
    MaxSnapshots = 3
    LocalBuild = FALSE
    SourceCanFail = TRUE
    ModelDownloads = TRUE
    ModelPrefetch = FALSE
    ModelApart = TRUE
    MutDropDownloadPin = FALSE
    MutLeaveBeforeLink = FALSE
    MutRetryOwn = FALSE
    MutAheadSkipsReuse = FALSE
    MutAheadKeptOnFailure = FALSE
    MutApartKeptOnFailure = FALSE
    MutApartNoChainLock = FALSE
    MutApartSkipsReuse = FALSE
    MutPrefetchLeaveEarly = FALSE
    MutAheadKeptWhenGone = FALSE
    MutCloseSkipsDropped = FALSE
    MutAwaitUnderLock = FALSE
    MutAwaitIgnoresIndex = FALSE
    MutAwaitNoGiveUp = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK ApplyExclusive ReuseBeforeBytes RetainedAncestry OwnerHasRecordedContent ApplyHasBytes ProviderHasResources CleanupComplete NoOwnRetry JoinedBlobPresent ChainApplyExclusive PrefetchHeldPresent AheadRefTracked PrefetchClosed AwaitHoldsNoLock
