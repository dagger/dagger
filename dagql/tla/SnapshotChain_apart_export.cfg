\* Applying apart beside a local export: the chain is built locally, and
\* its export registers each layer in the index, without the import locks,
\* while one import applies the same layers apart. At commit, the import
\* reuses a registered layer. Expected: pass.
\*
\* Reachability probe, injected with tla-check one; it must be violated:
\*   ProbeApartReuse == "apartReuse" \notin seen
\* A layer applied apart is reused instead at its commit.
CONSTANTS
    NumLayers = 2
    MaxStarts = 1
    MaxSnapshots = 3
    LocalBuild = TRUE
    SourceCanFail = TRUE
    ModelDownloads = TRUE
    ModelPrefetch = FALSE
    ModelApart = TRUE
    MutDropDownloadPin = FALSE
    MutLeaveBeforeLink = FALSE
    MutRetryOwn = FALSE
    MutAheadSkipsReuse = FALSE
    MutAheadKeptOnFailure = FALSE
    MutApartKeptOnFailure = FALSE
    MutApartNoChainLock = FALSE
    MutApartSkipsReuse = FALSE
    MutPrefetchLeaveEarly = FALSE
    MutAheadKeptWhenGone = FALSE
    MutCloseSkipsDropped = FALSE
SPECIFICATION Spec
