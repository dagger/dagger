\* Mutation: a failed import's drain releases nothing past the failed layer,
\* so a later layer applied apart keeps its snapshot and chain lock.
\* Expected: violates CleanupComplete.
CONSTANTS
    NumLayers = 2
    MaxStarts = 2
    MaxSnapshots = 3
    LocalBuild = FALSE
    SourceCanFail = TRUE
    ModelDownloads = TRUE
    ModelPrefetch = FALSE
    ModelApart = TRUE
    MutDropDownloadPin = FALSE
    MutLeaveBeforeLink = FALSE
    MutRetryOwn = FALSE
    MutAheadSkipsReuse = FALSE
    MutAheadKeptOnFailure = FALSE
    MutApartKeptOnFailure = TRUE
    MutApartNoChainLock = FALSE
    MutApartSkipsReuse = FALSE
    MutPrefetchLeaveEarly = FALSE
    MutAheadKeptWhenGone = FALSE
    MutCloseSkipsDropped = FALSE
    MutAwaitUnderLock = FALSE
    MutAwaitIgnoresIndex = FALSE
    MutAwaitNoGiveUp = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK ApplyExclusive ReuseBeforeBytes RetainedAncestry OwnerHasRecordedContent ApplyHasBytes ProviderHasResources CleanupComplete NoOwnRetry JoinedBlobPresent ChainApplyExclusive PrefetchHeldPresent AheadRefTracked PrefetchClosed AwaitHoldsNoLock
