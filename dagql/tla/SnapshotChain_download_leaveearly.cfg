\* Mutation: an importer lets go of a done download before linking its blob,
\* so GC may remove it first. Expected: violates ApplyHasBytes.
CONSTANTS
    NumLayers = 2
    MaxStarts = 2
    MaxSnapshots = 3
    LocalBuild = FALSE
    SourceCanFail = TRUE
    ModelDownloads = TRUE
    ModelPrefetch = FALSE
    MutDropDownloadPin = FALSE
    MutLeaveBeforeLink = TRUE
    MutRetryOwn = FALSE
    MutAheadSkipsReuse = FALSE
    MutAheadKeptOnFailure = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK ApplyExclusive ReuseBeforeBytes RetainedAncestry OwnerHasRecordedContent ApplyHasBytes ProviderHasResources CleanupComplete NoOwnRetry JoinedBlobPresent
