\* Mutation: an importer may retry a download it started itself after it
\* failed. Expected: violates NoOwnRetry.
CONSTANTS
    NumLayers = 2
    MaxStarts = 2
    MaxSnapshots = 3
    LocalBuild = FALSE
    SourceCanFail = TRUE
    ModelDownloads = TRUE
    ModelPrefetch = FALSE
    ModelApart = FALSE
    MutDropDownloadPin = FALSE
    MutLeaveBeforeLink = FALSE
    MutRetryOwn = TRUE
    MutAheadSkipsReuse = FALSE
    MutAheadKeptOnFailure = FALSE
    MutApartKeptOnFailure = FALSE
    MutApartNoChainLock = FALSE
    MutApartSkipsReuse = FALSE
    MutPrefetchLeaveEarly = FALSE
    MutAheadKeptWhenGone = FALSE
    MutCloseSkipsDropped = FALSE
    MutAwaitUnderLock = FALSE
    MutAwaitIgnoresIndex = FALSE
    MutAwaitNoGiveUp = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK ApplyExclusive ReuseBeforeBytes RetainedAncestry OwnerHasRecordedContent ApplyHasBytes ProviderHasResources CleanupComplete NoOwnRetry JoinedBlobPresent
