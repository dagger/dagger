\* Downloads ahead over a window (parallel layer downloads): a chain of three
\* layers, so an importer holds several later layers' downloads at once. Each
\* starts at a layer's loop top from the first layer the prefix walk found
\* missing, or once a layer's bytes are in, in any subset and order. Two
\* imports share, join and retry them, and GC prunes throughout. Expected:
\* pass.
\*
\* Reachability probes, injected with tla-check one; each must be violated:
\*   ProbeAheadSet == "aheadSet" \notin seen
\*   ProbeAheadPastPrefix == "aheadPastPrefix" \notin seen
\* The first: one importer holds two layers' downloads ahead. The second: an
\* import whose prefix walk found the first import's layers starts downloads
\* past them.
CONSTANTS
    NumLayers = 3
    MaxStarts = 2
    MaxSnapshots = 3
    LocalBuild = FALSE
    SourceCanFail = TRUE
    ModelDownloads = TRUE
    ModelPrefetch = FALSE
    MutDropDownloadPin = FALSE
    MutLeaveBeforeLink = FALSE
    MutRetryOwn = FALSE
    MutAheadSkipsReuse = FALSE
    MutAheadKeptOnFailure = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK ApplyExclusive ReuseBeforeBytes RetainedAncestry OwnerHasRecordedContent ApplyHasBytes ProviderHasResources CleanupComplete NoOwnRetry JoinedBlobPresent
