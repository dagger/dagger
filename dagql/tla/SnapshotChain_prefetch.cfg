\* Background prefetch: the prefetcher downloads layers' blobs into TTL
\* holds, joining or started by demand; once one blob of the chain is held
\* it imports the chain ahead of demand (importer 2, owner 2), each layer
\* waiting for its blob's hold, with no download of its own. Holds and the
\* import ahead go on retirement, replacement, TTL or consumption at any
\* time, while the import runs or after it kept its ref, and on close. One
\* demand import (importer 1) joins the prefetch's downloads and reuses the
\* import ahead's snapshots. Expected: pass.
\*
\* Reachability probes, injected with tla-check one; each must be violated:
\*   ProbePrefetchJoin == "prefetchJoin" \notin seen
\*   ProbeAheadReuse == "aheadReuse" \notin seen
\*   ProbeAheadKept == "aheadKept" \notin seen
\*   ProbeAheadGoneRunning == ~(ahead = "gone" /\ workers[2].phase \in {"lock", "lookup", "fetch", "waitDl", "ready", "applying", "advance"})
\*   ProbeClosedAfterKeep == ~(pclose = "closed" /\ "aheadKept" \in seen)
\*   ProbeAwaitIndexed == "awaitIndexed" \notin seen
\*   ProbeAwaitGiveUp == "awaitGiveUp" \notin seen
\*   ProbeAwaitedBlobGone == "awaitedBlobGone" \notin seen
\* The first: demand joins a prefetch's download. The second: demand reuses
\* a snapshot the import ahead holds. The third: the import ahead keeps its
\* ref. The fourth: the janitor has taken a dropped ahead while its import
\* still runs. The fifth: close releases a kept import ahead. The sixth: a
\* wait for a blob ends because demand imported the layer. The seventh: a
\* wait gives up with no prefetch coming. The eighth: a held blob goes
\* before the import ahead pins it, and the layer fails.
CONSTANTS
    NumLayers = 2
    MaxStarts = 2
    MaxSnapshots = 3
    LocalBuild = FALSE
    SourceCanFail = TRUE
    ModelDownloads = TRUE
    ModelPrefetch = TRUE
    ModelApart = FALSE
    MutDropDownloadPin = FALSE
    MutLeaveBeforeLink = FALSE
    MutRetryOwn = FALSE
    MutAheadSkipsReuse = FALSE
    MutAheadKeptOnFailure = FALSE
    MutApartKeptOnFailure = FALSE
    MutApartNoChainLock = FALSE
    MutApartSkipsReuse = FALSE
    MutPrefetchLeaveEarly = FALSE
    MutAheadKeptWhenGone = FALSE
    MutCloseSkipsDropped = FALSE
    MutAwaitUnderLock = FALSE
    MutAwaitIgnoresIndex = FALSE
    MutAwaitNoGiveUp = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK ApplyExclusive ReuseBeforeBytes RetainedAncestry OwnerHasRecordedContent ApplyHasBytes ProviderHasResources CleanupComplete NoOwnRetry JoinedBlobPresent ChainApplyExclusive PrefetchHeldPresent AheadRefTracked PrefetchClosed AwaitHoldsNoLock
