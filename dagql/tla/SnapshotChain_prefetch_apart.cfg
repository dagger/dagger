\* Background prefetch with layers applied apart, as on overlayfs: the
\* import ahead and demand both apply apart, under the chain-ID locks.
\* Expected: pass.
\*
\* Reachability probe, injected with tla-check one; it must be violated:
\*   ProbeAwaitHoldingLater == "awaitIndexedHoldingLater" \notin seen
\* The import ahead's wait for a layer ends because demand imported it,
\* while the import ahead holds a later layer's chain lock.
