\* Mutation: a layer's wait does not end once another import has imported
\* the layer, so it lasts as long as the stalled prefetch. Expected: violates
\* AwaitEnds (temporal).
CONSTANTS
    NumLayers = 2
    MaxStarts = 2
    MaxSnapshots = 3
    LocalBuild = FALSE
    SourceCanFail = FALSE
    ModelDownloads = TRUE
    ModelPrefetch = TRUE
    ModelApart = FALSE
    MutDropDownloadPin = FALSE
    MutLeaveBeforeLink = FALSE
    MutRetryOwn = FALSE
    MutAheadSkipsReuse = FALSE
    MutAheadKeptOnFailure = FALSE
    MutApartKeptOnFailure = FALSE
    MutApartNoChainLock = FALSE
    MutApartSkipsReuse = FALSE
    MutPrefetchLeaveEarly = FALSE
    MutAheadKeptWhenGone = FALSE
    MutCloseSkipsDropped = FALSE
    MutAwaitUnderLock = FALSE
    MutAwaitIgnoresIndex = TRUE
    MutAwaitNoGiveUp = FALSE
SPECIFICATION LiveSpec
PROPERTY AwaitEnds
