\* The import ahead's wait for a blob ends once its outcome is settled: the
\* blob held, the layer imported by another import, or no prefetch coming
\* for it. Fairness covers only the wait's own steps: downloads, prefetches
\* and the other import may stall. Layers in order, no source failures.
\* Expected: pass.
CONSTANTS
    NumLayers = 2
    MaxStarts = 2
    MaxSnapshots = 3
    LocalBuild = FALSE
    SourceCanFail = FALSE
    ModelDownloads = TRUE
    ModelPrefetch = TRUE
    ModelApart = FALSE
    MutDropDownloadPin = FALSE
    MutLeaveBeforeLink = FALSE
    MutRetryOwn = FALSE
    MutAheadSkipsReuse = FALSE
    MutAheadKeptOnFailure = FALSE
    MutApartKeptOnFailure = FALSE
    MutApartNoChainLock = FALSE
    MutApartSkipsReuse = FALSE
    MutPrefetchLeaveEarly = FALSE
    MutAheadKeptWhenGone = FALSE
    MutCloseSkipsDropped = FALSE
    MutAwaitUnderLock = FALSE
    MutAwaitIgnoresIndex = FALSE
    MutAwaitNoGiveUp = FALSE
SPECIFICATION LiveSpec
PROPERTY AwaitEnds
