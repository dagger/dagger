server {
    listen       8000 default_server;
    server_name  _;
    gzip on;
    gzip_types text/plain application/xml text/css text/javascript application/javascript application/json;

    # Emit relative Location headers. nginx otherwise builds them from its own
    # listen port, so the trailing-slash redirect on every directory URL would
    # point at :8000 -- wrong whenever the port is published as something else,
    # which is exactly what `dagger call server up` does.
    absolute_redirect off;

    # The build has no page at /: the landing page lives in Getting Started,
    # and in production netlify.toml redirects the root there. Mirror that
    # rule, or the try_files fallback below lands on a file that does not
    # exist and nginx answers 403 rather than serving anything.
    location = / {
        return 301 /getting-started/introduction;
    }

    location / {
        root   /var/www;
        # Docusaurus emits a static page per route, so a miss is a real miss.
        # Falling back to /index.html would be an SPA pattern, and with no
        # such file every unknown path turns into a 403 instead of a 404.
        try_files $uri $uri/ =404;
    }

    error_page   404  /404.html;
    location = /404.html {
        root   /var/www;
        internal;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /var/www;
    }
}
