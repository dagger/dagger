\* Mutation: child registration during teardown blocks on a lock that
\* teardown holds instead of failing fast, so the registering owner never
\* releases its lease and the uncancellable lease barrier never completes.
\* Expected: violate TeardownEventuallyCompletes (temporal).
SPECIFICATION LiveSpec
CONSTANTS
    Clients = {root, child}
    root = root
    child = child
    Root = root
    NoClient = none
    ParentOf <- RootParents
    Requests = {q1}
    Works = {w1}
    ModelBackground = TRUE
    ModelChildren = TRUE
    ModelTeardown = TRUE
    BlockingRegistration = TRUE
INVARIANTS TypeOK LeaseExact ActiveWorkHasRuntime NoEarlyReclamation MetricsDrainAfterProducers MetricsStopBeforeReclamation NoClientResurrection ChildRetainsParent TelemetryStopsAfterProducers
PROPERTIES TeardownEventuallyCompletes
