\* An accepted parent request registers a child. Closing both transports and
\* draining both request sets may race; the child runtime retains the parent
\* until child quiescence. Expected: pass.
SPECIFICATION LiveSpec
CONSTANTS
    Clients = {root, child}
    root = root
    child = child
    Root = root
    NoClient = none
    ParentOf <- RootParents
    Requests = {q1, q2}
    Works = {}
    ModelBackground = FALSE
    ModelChildren = TRUE
    ModelTeardown = FALSE
    BlockingRegistration = FALSE
INVARIANTS TypeOK LeaseExact ActiveWorkHasRuntime NoEarlyReclamation MetricsDrainAfterProducers MetricsStopBeforeReclamation NoClientResurrection ChildRetainsParent
PROPERTY QuiescentClientEventuallyReclaimed
