\* Three-level ancestry: root -> child -> grandchild, with detached work and
\* session teardown. A grandchild's registration (from a request or from
\* detached work) retains the child, the child's runtime retains the root, and
\* reclamation cascades up only from the leaf. Expected: pass.
SPECIFICATION LiveSpec
CONSTANTS
    Clients = {root, child, grandchild}
    root = root
    child = child
    grandchild = grandchild
    Root = root
    NoClient = none
    ParentOf <- ChainParents
    Requests = {q1, q2}
    Works = {w1}
    ModelBackground = TRUE
    ModelChildren = TRUE
    ModelTeardown = TRUE
INVARIANTS TypeOK LeaseExact ActiveWorkHasRuntime NoEarlyReclamation MetricsDrainAfterProducers MetricsStopBeforeReclamation NoClientResurrection ChildRetainsParent TelemetryStopsAfterProducers
PROPERTIES QuiescentClientEventuallyReclaimed QuiescentTeardownEventuallyCompletes TeardownEventuallyCompletes
