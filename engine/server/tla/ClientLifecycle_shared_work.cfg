    Clients = {root}
    root = root
    Root = root
    NoClient = none
    ParentOf <- RootParents
    Requests = {q1}
    Works = {w1}
    ModelBackground = TRUE
    ModelChildren = FALSE
    ModelTeardown = FALSE
INVARIANTS TypeOK LeaseExact ActiveWorkHasRuntime NoEarlyReclamation NoClientResurrection
