\* Mutation: malformed or explicitly empty metadata silently falls back to
\* the exec bootstrap identity. Expected: violate MalformedRejected.
SPECIFICATION Spec
CONSTANTS
    Clients = {base, first, second}
    Base = base
    NoClient = none
    ScopeParent = executable
    MetadataParent = workspaceOwner
    ForeignCarrier = foreignCarrier
    ExecSecret = execSecret
    OtherSecret = otherSecret
    Requests = {q1, q2, q3}
    UseMetadataParent = FALSE
    AllowCrossCarrier = FALSE
    AllowClosedRebind = FALSE
    AllowClosedSubstitution = FALSE
    AllowMalformedFallback = TRUE
    RetryClosedTransport = FALSE
    CloseAllOnOneClose = FALSE
INVARIANTS TypeOK MalformedRejected
