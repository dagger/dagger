\* Mutation: return a retryable result for a closed transport. Expected:
\* violate ClosedIsTerminal.
SPECIFICATION Spec
CONSTANTS
    Clients = {base, first, second}
    Base = base
    NoClient = none
    ScopeParent = executable
    MetadataParent = workspaceOwner
    ForeignCarrier = foreignCarrier
    ExecSecret = execSecret
    OtherSecret = otherSecret
    Requests = {q1, q2, q3}
    UseMetadataParent = FALSE
    AllowCrossCarrier = FALSE
    AllowClosedRebind = FALSE
    AllowClosedSubstitution = FALSE
    AllowMalformedFallback = FALSE
    RetryClosedTransport = TRUE
    CloseAllOnOneClose = FALSE
INVARIANTS TypeOK ClosedIsTerminal
