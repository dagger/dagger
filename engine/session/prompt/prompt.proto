syntax = "proto3";

package dagger.prompt;

option go_package = "prompt";

service Prompt {
  rpc PromptBool(BoolRequest) returns (BoolResponse);
  rpc PromptString(StringRequest) returns (StringResponse);
  rpc PromptSelect(SelectRequest) returns (SelectResponse);
  rpc PromptApproval(ApprovalRequest) returns (ApprovalResponse);
  rpc PromptAsk(AskRequest) returns (AskResponse);
}

message BoolRequest {
    // the prompt to display to the user
    string prompt = 1;
    // if provided, the prompt will be persisted and not reprompted
    string persistentKey = 2;
    // the default value to return if the user doesn't respond
    bool default = 3;
    // a (very) brief title for the prompt
    string title = 4;
}

message BoolResponse {
    // the response from the user
    bool response = 1;
}

message StringRequest {
    // the prompt to display to the user
    string prompt = 1;
    // the default value to return if the user doesn't respond
    string default = 2;
    // a (very) brief title for the prompt
    string title = 3;
}

message StringResponse {
    // the response from the user
    string response = 1;
}

message SelectChoice {
    string id = 1;
    string label = 2;
}

message SelectRequest {
    string title = 1;
    string prompt = 2;
    repeated SelectChoice choices = 3;
    // Required: must name a choice. Never implicitly select the first action.
    string default_choice = 4;
}

message SelectResponse {
    string choice = 1;
}

// ApprovalRequester is who asks: the agent and module whose code requests
// access, and the function it was running. The engine resolves every value
// itself, never taking the requester's word for it, but names may be chosen
// by a module or by the code spawning the agent, so they arrive as literal
// text escaped for terminals, like the prompt.
message ApprovalRequester {
    // the agent's display name, e.g. "engine-tools"
    string agent_name = 1;
    // the agent's unique runtime handle within the session
    string agent_handle = 2;
    // the requesting module's name
    string module = 3;
    // the requesting module's source reference, e.g. a git URL with a pin
    string module_ref = 4;
    // the module function that made the request, e.g. "Contributor.gh"
    string function = 5;
}

// ApprovalRequest asks the user to grant an agent access to something on
// their behalf: pushing with their credentials, reading a host secret, ...
message ApprovalRequest {
    // what is being approved, e.g. "git-push", "git-force-push", "git-read",
    // "secret", "git-identity". Frontends may style by kind.
    string kind = 1;
    // the question to display, as literal (already escaped) text
    string prompt = 2;
    // the thing access is requested to (a remote, a secret URI, ...), as
    // literal text; empty when the kind has no subject
    string subject = 3;
    ApprovalRequester requester = 4;
    // the call that requested approval, so a frontend can show the prompt
    // where that call is rendered (e.g. under an agent's tool call)
    string trace_id = 5;
    string span_id = 6;
    // if set, the client may remember an APPROVAL_ALLOW_FOREVER decision
    // under this key and answer later requests with it without prompting; if
    // empty, APPROVAL_ALLOW_FOREVER is not offered
    string persistent_key = 7;
    // the operation is destructive (e.g. a force-push); frontends should
    // highlight it
    bool danger = 8;
    // the bare question, without who asks, stating the action itself rather
    // than asking for permission (e.g. "Push to <remote> @ <ref>?"), as
    // literal text: frontends that render the requester and the grant choices
    // themselves show this instead of prompt, which also names who asks
    string question = 9;
    // keys an older client may have remembered an equivalent forever grant
    // under (e.g. "allow_llm:<module>"): if the client remembers any of them,
    // it answers APPROVAL_ALLOW_FOREVER without prompting. Never remembered
    // anew: a new forever grant goes under persistent_key.
    repeated string legacy_persistent_keys = 10;
}

enum ApprovalDecision {
    APPROVAL_DENY = 0;
    APPROVAL_ALLOW_ONCE = 1;
    APPROVAL_ALLOW_SESSION = 2;
    APPROVAL_ALLOW_FOREVER = 3;
}

message ApprovalResponse {
    ApprovalDecision decision = 1;
}

// AskRequest asks the user a question on behalf of the engine or a module:
// a yes/no answer, some text, a choice, or a secret. Like an approval, it
// names who asks (resolved by the engine) and the call that asks, so a
// frontend can show it where that call is rendered.
message AskRequest {
    // what is asked, e.g. "llm-help", "workspace-checkpoint". Frontends may
    // style by kind.
    string kind = 1;
    // a (very) brief title, as literal (already escaped) text; may be empty
    string title = 2;
    // the message, as Markdown whose terminal control characters the engine
    // already escaped. It never names who asks: frontends render requester.
    string message = 3;
    ApprovalRequester requester = 4;
    // the call that asks, so a frontend can show the question where that
    // call is rendered
    string trace_id = 5;
    string span_id = 6;
    // if set, the client may remember the answer under this key and answer
    // later requests with it without prompting. Never set for secrets.
    string persistent_key = 7;
    // the kind of answer wanted
    oneof input {
        AskBoolean boolean = 8;
        AskText text = 9;
        AskSelect select = 10;
        AskSecret secret = 11;
    }
}

message AskBoolean {
    // the answer preselected for the user
    bool default = 1;
}

message AskText {
    // the text the input starts with
    string default = 1;
    // accept several lines
    bool multiline = 2;
}

message AskSelect {
    repeated SelectChoice choices = 1;
    // Required: must name a choice.
    string default_choice = 2;
}

message AskSecret {
    // accept several lines
    bool multiline = 1;
}

message AskResponse {
    // the answer, of the kind asked for
    oneof answer {
        bool boolean = 1;
        string text = 2;
        // the ID of the chosen SelectChoice
        string choice = 3;
        bytes secret = 4;
    }
}
