[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.0.0-beta.10"
edition = "2024"
rust-version = "1.97.1"
authors = ["kjuulh <contact@kasperhermansen.com>", "Dagger <hello@dagger.io>"]
repository = "https://github.com/dagger/dagger"
license = "Apache-2.0"

[workspace.dependencies]
dagger-codegen = { version = "=1.0.0-beta.10", path = "crates/dagger-codegen" }
dagger-bootstrap = { version = "=1.0.0-beta.10", path = "crates/dagger-bootstrap" }
dagger-sdk = { version = "=1.0.0-beta.10", path = "crates/dagger-sdk", default-features = false }
dagger-sdk-completeness = { version = "=1.0.0-beta.10", path = "crates/dagger-sdk-completeness" }

eyre = "0.6.9"
color-eyre = "0.6.2"
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
serde_graphql_input = { version = "0.1.1" }
tokio = { version = "1.35.1", features = ["full"] }
tracing = { version = "0.1.40", features = ["log"] }
tracing-subscriber = { version = "0.3.18", features = [
  "tracing-log",
  "tracing",
] }
thiserror = "1.0.56"
futures = "0.3.30"
derive_builder = "0.12.0"
base64 = "0.21.6"
dirs = "5.0.1"
flate2 = { version = "1.0.28", features = ["rust_backend"] }
graphql_client = { version = "0.16.0", features = [
  "reqwest-rustls",
  "graphql_query_derive",
], default-features = false }
hex = "0.4.3"
hex-literal = "0.4.1"
platform-info = "2.0.2"
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace"] }
reqwest = { version = "0.12.23", features = [
  "stream",
  "json",
  "rustls-tls",
], default-features = false }
sha2 = "0.10.8"
graphql-parser = "0.4.1"
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full", "extra-traits"] }
semver = "1.0.28"
tar = "0.4.40"
tempfile = "3.9.0"
tracing-opentelemetry = { version = "=0.33.0", default-features = false }
async-trait = "0.1.77"
which = "6.0.3"
url = "2.5.8"
zip = { version = "=8.2.0", default-features = false, features = ["deflate-flate2"] }
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
convert_case = "0.6.0"
itertools = "0.12.0"

pretty_assertions = "1.4.0"
proptest = "1.11.0"
loom = "0.7.2"
trybuild = "1.0.120"
rand = "0.8.5"
tracing-test = "0.2.4"
clap = "4.4.14"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
