# cargo-deny policy for the Rust SDK's advisories, licenses, dependency graph, and
# package sources. Run `cargo deny check`; CI enforces the same command.

[advisories]
# Every active RustSec advisory fails the check. Any future exception must name the
# advisory and explain why it is not reachable while an upstream fix is unavailable.
ignore = []

[licenses]
# Deny by default: every dependency must resolve to an explicitly accepted license.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = []

# ring's license is documented in its bundled LICENSE file but is not expressed
# in Cargo metadata.
[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Async and HTTP dependency trees commonly contain justified duplicate major versions.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
